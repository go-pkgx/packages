distributable:
  - url: https://sqlite.org/2025/sqlite-autoconf-{{version.major}}{{version.minor}}0{{version.patch}}00.tar.gz
    strip-components: 1
  - url: https://sqlite.org/2026/sqlite-autoconf-{{version.major}}{{version.minor}}0{{version.patch}}00.tar.gz
    strip-components: 1

versions:
  github: sqlite/sqlite/tags
  strip: /^version-/

# wasip1/wasm recipe: the sqlite3 shell, compiled straight from the amalgamation
# (shell.c + sqlite3.c of the autoconf tarball; no configure). wasi-libc has no
# threads, mmap or file locking and no dlopen, hence the OMIT/THREADSAFE
# switches; getpid/process-clocks/signal come from wasi-libc's emulation
# libraries (the _WASI_EMULATED_* macros + -lwasi-emulated-*).

build:
  script:
    - run: >-
        $BK_CC -O2
        -DSQLITE_THREADSAFE=0 -DSQLITE_OMIT_LOAD_EXTENSION=1 -DSQLITE_OMIT_WAL=1
        -DSQLITE_OMIT_SHARED_CACHE=1 -DSQLITE_NO_SYNC=1 -DSQLITE_DEFAULT_MEMSTATUS=0
        -DSQLITE_NOHAVE_SYSTEM=1
        -D_WASI_EMULATED_GETPID -D_WASI_EMULATED_PROCESS_CLOCKS -D_WASI_EMULATED_SIGNAL
        -o sqlite3.wasm shell.c sqlite3.c
        -lwasi-emulated-getpid -lwasi-emulated-process-clocks -lwasi-emulated-signal
    - install -D sqlite3.wasm "{{ prefix }}/bin/sqlite3.wasm"
    - install -D sqlite3.h "{{ prefix }}/include/sqlite3.h"

provides:
  - bin/sqlite3
