# windows-c: C projects cross-built for windows/x86-64 from linux, with
# llvm-mingw, in the same FROM-scratch rootfs the other sovereign lanes use.
#
# ⛔ THE GAP THIS FILLS. `windows.yml` builds from `windows/go-projects.txt`
# and `windows-rust.yml` from `windows/rust-projects.txt`; both compile a
# language toolchain's own output. A C project in the pantry had no Windows
# lane at all, so `windows/x86-64` has Go and Rust binaries and not one C
# library. Measured 2026-11-03: `zlib.net` resolves for linux and darwin and
# `NOT published here` for windows.
#
# ⛔ THE COMPILER COMES FROM THE RECIPE. For every other target bk puts
# `llvm.org` into the environment itself; for a windows cross build it
# deliberately does not — "its compiler comes from the recipe's llvm-mingw
# dep" (bk buildscript/wrapper.go). So each recipe here declares
# `llvm.org/mingw-w64` and names `x86_64-w64-mingw32-*` itself. A recipe that
# forgets gets "C compiler cannot create executables", not a missing-dep error.
#
# Recipes: windows/recipes/<slug>/package.hcl — a Windows build is its own
# small recipe, as wasip1's is, rather than a conditional in the host recipe.
#
# workflow_dispatch only, like the other factories.
name: windows-c
on:
  workflow_dispatch:
permissions: { contents: read, packages: write }
env:
  GOPROXY: https://proxy.golang.org,direct
  GONOPROXY: github.com/go-zpkg/*
  ZPKG_DIST: oci://ghcr.io/go-pkgx/packages
  ZPKG_PANTRY_OVERLAY: https://raw.githubusercontent.com/go-zpkg/pantry-overlay/main/projects

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Modest on purpose: parallel matrices in this repository have starved
      # other lanes (37 concurrent jobs caused cancellations).
      max-parallel: 4
      matrix:
        include:
          # bin: the .exe under <prefix>/bin that must be a PE for this to
          # count as a Windows build at all.
          - { runner: ubuntu-latest, platform: linux/x86-64, slug: zlib.net, version: "1.3.2", bin: minigzip.exe }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - name: build bk, pkgx and pkgm (static)
        # Pinned rather than @main because this lane publishes.
        run: |
          # ⛔ v0.58.0 IS THE FLOOR FOR THIS LANE, not a routine bump. Below it,
          # bk's own compiler shim shadowed llvm-mingw and could not delegate:
          # compilerShimsFor shims the TRIPLE-PREFIXED names and puts them first
          # on PATH, and with no $BK_CC (which bk deliberately does not set for
          # windows) the shim reduced `x86_64-w64-mingw32-gcc` to a bare `gcc`
          # that llvm-mingw does not ship. go-zpkg/bk#405.
          #
          # ⛔ v0.59.0 was the floor, and not because anything here needed a
          # newer factory: Go verifies the path a module DECLARES, and v0.58.0
          # declares `github.com/go-pkgx/bk`. v0.59.0 is the first tag
          # declaring `github.com/go-zpkg/zbk`. The #405 requirement above
          # still holds.
          #
          # ⛔⛔ v0.64.0 NOW, AND THIS TIME A FEATURE DOES REQUIRE IT. Builds
          # carry an identity only from v0.62.0, that identity only became a
          # real Merkle hash in v0.63.0, and v0.64.0 puts the signer's key id
          # on the signature referrer. A lane left at v0.59.0 keeps publishing
          # bottles with no identity, which `zpkgs builds` can only report as
          # "nothing recorded".
          #
          # ⛔⛔ v0.65.0 now, for a SECOND reason: from that tag the factory
          # refuses to publish bytes that differ from what a hashed tag
          # already holds. A lane at v0.64.0 computes a good identity and will
          # still overwrite an address (go-zpkg/zbk#416).
          CGO_ENABLED=0 go install github.com/go-zpkg/zbk/cmd/zbk@v0.65.0
          CGO_ENABLED=0 go install github.com/go-zpkg/zpkgx@main
          CGO_ENABLED=0 go install github.com/go-zpkg/zpkgm@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: stage the sovereign rootfs
        run: |
          sudo rm -rf "$RUNNER_TEMP/rootfs"
          zbk builder \
            --out "$RUNNER_TEMP/rootfs" \
            --platform "${{ matrix.platform }}" \
            --toolchain builder/toolchain.txt \
            # `zbk`/`zpkgx` since the rename: `pkgx` is upstream's binary and
            # can be on the same PATH. See sovereign.yml.
            --bk "$(command -v zbk)" \
            --pkgx "$(command -v zpkgx)" \
            --container
      - name: build ${{ matrix.slug }} ${{ matrix.version }} for windows/x86-64, in the rootfs
        run: |
          chmod +x builder/sovereign-bk.sh
          builder/sovereign-bk.sh "$RUNNER_TEMP/rootfs" "$PWD/windows/recipes" "$PWD/advisories" \
            /usr/local/bin/bk --platform windows/x86-64 build --libc=pkgx \
            --recipe "/recipes/${{ matrix.slug }}/package.hcl" --version "${{ matrix.version }}" \
            --dist /dist "${{ matrix.slug }}"
      # WHAT RAN, FROM WHERE — the same negative claim the wasm lane makes: a
      # name that prints nothing is a tool that is NOT in the rootfs.
      #
      # ⛔ `always()`, BECAUSE THIS IS THE EVIDENCE FOR THE STEP ABOVE. It ran
      # after the build and therefore only ever ran when nothing was wrong.
      # The first real failure here was
      #
      #   x86_64-w64-mingw32-gcc -O3 -Wall -c -o adler32.o adler32.c
      #   bk gcc: gcc is not on PATH outside …/build.libexec
      #
      # — a question about which compiler names the llvm-mingw bottle actually
      # ships, asked of a step that had just been skipped for failing to
      # answer it. A diagnostic that runs only on success is not a diagnostic.
      #
      # So it also LISTS the bottle's bin rather than probing names guessed in
      # advance: `command -v` can only confirm a name someone already thought
      # of, and the whole question here is what is there.
      - name: what ran, from where
        if: always()
        run: |
          builder/sovereign-bk.sh "$RUNNER_TEMP/rootfs" "$PWD/windows/recipes" "$PWD/advisories" \
            /bin/sh -c 'command -v sh make install x86_64-w64-mingw32-clang x86_64-w64-mingw32-gcc; echo "--- llvm-mingw bin:"; ls /pkgx/llvm.org/mingw-w64/v*/bin; echo "PATH=$PATH"'
      # ⛔ IS IT ACTUALLY A WINDOWS BINARY? A cross build that silently fell
      # back to the host compiler produces a working ELF and a green job, and
      # the first person to find out is whoever runs it on Windows.
      #
      # ⛔ AND THE CHECK LOOKS INSIDE THE BOTTLE. This was a `find` for a loose
      # .exe under dist, piped into `objdump | grep -o`. It reported
      #
      #   ::error::minigzip.exe was not built
      #
      # for a build that had just SUCCEEDED, because dist holds the packaged
      # bottle and there is no loose file to find. A pipeline cannot tell "the
      # build produced nothing" from "I looked in the wrong place", which is
      # the one distinction this step exists to make — so it is a Go tool with
      # tests, it opens the archives, and it prints its denominator.
      - name: the artefact is a PE, not an ELF
        run: |
          go run ./pecheck -dir "$RUNNER_TEMP/rootfs/dist" \
            -member "bin/${{ matrix.bin }}" -arch x86-64
