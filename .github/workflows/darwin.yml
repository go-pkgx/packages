name: darwin

# macOS bottles for ghcr.io/go-pkgx/packages. Same pure-Go bk pipeline and the
# same signed-OCI registry as the linux factory (build.yml) — the ONLY
# difference is native macOS runners instead of a debian container (GitHub's
# macOS runners are already clean, ephemeral VMs, so they are the isolation).
# factory.sh is platform-agnostic (PLATFORM=darwin/<arch>); nothing else changes.
on:
  workflow_dispatch:
    inputs:
      recipes:
        description: "space-separated projects to build (blank = recipes.txt)"
        required: false
        default: ""
  schedule:
    # one hour after the linux factory, to spread load across the two registries.
    - cron: "0 7 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14,       platform: darwin/aarch64, dist_name: dist-darwin-aarch64 } # Apple Silicon
          - { runner: macos-15-intel, platform: darwin/x86-64,  dist_name: dist-darwin-x86-64 }  # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: base tools
        # macOS runners ship git, curl, xz, jq and the Xcode command-line tools
        # (the C toolchain) already; only gettext (msgfmt, for recipes with po/)
        # is missing. Best-effort — never fail the run on a tool install.
        run: |
          brew install gettext >/dev/null 2>&1 || true
          brew link --force gettext >/dev/null 2>&1 || true
          command -v python >/dev/null || ln -sf "$(command -v python3)" /usr/local/bin/python || true

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: stable }

      - name: install pkgx (bk sources its toolchain via `pkgx +deps`)
        run: |
          curl -fsS https://pkgx.sh | sh
          for d in "$HOME/.local/bin" /usr/local/bin /opt/homebrew/bin; do
            [ -x "$d/pkgx" ] && { echo "$d" >> "$GITHUB_PATH"; break; }
          done

      - name: install bk
        # GOPROXY=direct: pull the current main straight from GitHub, else the
        # module proxy serves a stale cached @main and CI runs an old bk.
        run: |
          GOPROXY=direct go install github.com/go-pkgx/bk/cmd/bk@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: tool versions
        run: |
          pkgx --version
          bk 2>&1 | head -1 || true

      - name: clone pantry
        run: git clone --depth 1 https://github.com/pkgxdev/pantry

      - name: build + publish bottles
        env:
          PLATFORM: ${{ matrix.platform }}
          RECIPES: ${{ github.event.inputs.recipes }}
          OCI_USERNAME: ${{ github.actor }}
          # The workflow's built-in token (permissions.packages: write above) —
          # no long-lived PAT; auto-rotated per run. The go-pkgx/packages
          # packages are owned by this repo, so GITHUB_TOKEN writes natively.
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.BOTTLE_SIGNING_KEY }}
        run: bash factory.sh

      # The pkgx dist tree factory.sh writes (bk build --dist dist) — deployed to
      # the GitHub Pages mirror by the central pages.yml aggregator. Uploaded per
      # platform so the aggregator can union all four build workflows' trees.
      - name: upload dist tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dist_name }}
          path: dist
          if-no-files-found: ignore

      - name: upload failures list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ strategy.job-index }}
          path: failures.txt
          if-no-files-found: ignore
