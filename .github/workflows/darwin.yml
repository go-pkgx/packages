name: darwin

# macOS bottles for ghcr.io/go-pkgx/packages. Same pure-Go bk pipeline and the
# same signed-OCI registry as the linux factory (build.yml) — the ONLY difference
# is native macOS runners instead of a debian container (GitHub's macOS runners
# are already clean, ephemeral VMs, so they are the isolation). `bk factory` is
# platform-agnostic (PLATFORM=darwin/<arch>). The whole recipes.txt is chunked
# across both arches; macOS runner concurrency is scarce so max-parallel is low.
on:
  workflow_dispatch:
    inputs:
      recipes:
        description: "space-separated projects to build (blank = the whole recipes.txt, chunked)"
        required: false
        default: ""
      versions:
        description: "only consider versions matching this pkgx constraint. A BARE version is a RANGE — use '=1.2.3' for exactly one. Without it a targeted run walks EVERY version of the named projects, which on macOS runners costs hours and fails on the old ones."
        required: false
        default: ""
      max_versions:
        description: "cap versions per requested project, newest first (blank = all)"
        required: false
        default: ""
      no_closure:
        description: "build ONLY the projects named in recipes, not their dependency closure. For a REPAIR run: the dependencies are already published, and walking to them costs a version resolution each and can drag a toolchain in behind them."
        required: false
        default: ""
      mirror_from:
        description: "copy the bottles from this upstream dist instead of building them, e.g. https://dist.pkgx.dev — the cheap way to restore a platform an index lost"
        required: false
        default: ""
  # schedule:  # cron disabled 2026-08-12 (free runners for targeted jobs; workflow_dispatch kept)
    # - cron: "0 7 * * *"

permissions:
  contents: read
  packages: write

env:
  CHUNK: "50"

jobs:
  setup:
    # Our own GARM/Incus pool: 32 cores, ephemeral container per job, tagged
    # [self-hosted, incus, amd64]. Linux work runs here rather than on GitHub's
    # minutes. If the pool is down, jobs queue — swap this line back to
    # `ubuntu-latest` to get moving again.
    runs-on: [self-hosted, incus, amd64]
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      # The Incus runner image is a plain Debian cloud image: no jq, no git, no
      # go. setup-go brings its own, checkout falls back to the API tarball, and
      # jq is one apt line. A no-op wherever it is already there.
      - name: jq
        run: command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq; }
      - uses: actions/checkout@v4
      - id: gen
        run: |
          if [ -n "${{ github.event.inputs.recipes }}" ]; then
            m='{"include":[{"runner":"macos-14","platform":"darwin/aarch64","slug":"darwin-aarch64","chunk":"manual"},{"runner":"macos-15-intel","platform":"darwin/x86-64","slug":"darwin-x86-64","chunk":"manual"}]}'
          else
            total=$(grep -vcE '^[[:space:]]*(#|$)' recipes.txt)
            n=$(( (total + CHUNK - 1) / CHUNK ))
            m=$(jq -cn --argjson n "$n" '{include: [range(0;$n) as $c
              | ({runner:"macos-14",platform:"darwin/aarch64",slug:"darwin-aarch64"},
                 {runner:"macos-15-intel",platform:"darwin/x86-64",slug:"darwin-x86-64"})
              + {chunk:($c|tostring)}]}')
          fi
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m" | jq '.include | length | "\(.) build jobs"'

  build:
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 6   # macOS runner concurrency is limited; keep the fan-out modest
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: base tools
        # macOS runners ship git, curl, xz, jq and the Xcode command-line tools
        # already; only gettext (msgfmt, for recipes with po/) is missing.
        run: |
          brew install gettext >/dev/null 2>&1 || true
          brew link --force gettext >/dev/null 2>&1 || true
          command -v python >/dev/null || ln -sf "$(command -v python3)" /usr/local/bin/python || true

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with: { go-version: stable }

      - name: install pkgx (bk sources its toolchain via `pkgx +deps`)
        run: |
          curl -fsS https://pkgx.sh | sh
          for d in "$HOME/.local/bin" /usr/local/bin /opt/homebrew/bin; do
            [ -x "$d/pkgx" ] && { echo "$d" >> "$GITHUB_PATH"; break; }
          done

      - name: install bk
        run: |
          GOPROXY=direct go install github.com/go-pkgx/bk/cmd/bk@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: clone pantry
        run: git clone --depth 1 https://github.com/pkgxdev/pantry

      - name: build + publish this chunk
        env:
          PLATFORM: ${{ matrix.platform }}
          OCI_USERNAME: ${{ github.actor }}
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.BOTTLE_SIGNING_KEY }}
          VERSIONS: ${{ github.event.inputs.versions }}
          MAX_VERSIONS: ${{ github.event.inputs.max_versions }}
          MIRROR_FROM: ${{ github.event.inputs.mirror_from }}
        run: |
          if [ "${{ matrix.chunk }}" = "manual" ]; then
            RECIPES="${{ github.event.inputs.recipes }}"
          else
            start=$(( ${{ matrix.chunk }} * CHUNK + 1 )); end=$(( start + CHUNK - 1 ))
            RECIPES="$(grep -vE '^[[:space:]]*(#|$)' recipes.txt | sed -n "${start},${end}p" | tr '\n' ' ')"
          fi
          # shellcheck disable=SC2086  # RECIPES is intentionally word-split to count projects
          echo "chunk ${{ matrix.chunk }} → $(printf '%s\n' $RECIPES | grep -c .) requested projects"
          # RECIPES, NO_CLOSURE and PLATFORM are read from the env by `bk factory` itself.
          NO_CLOSURE="${{ github.event.inputs.no_closure }}"
          export RECIPES NO_CLOSURE
          bk factory \
            --pantry pantry \
            --overrides overrides \
            --to oci://ghcr.io/go-pkgx/packages \
            --bottles dist \
            ${VERSIONS:+--versions "$VERSIONS"} \
            ${MAX_VERSIONS:+--max-versions "$MAX_VERSIONS"} \
            ${MIRROR_FROM:+--mirror-from "$MIRROR_FROM"}

      - name: upload dist tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.slug }}-${{ matrix.chunk }}
          path: dist
          if-no-files-found: ignore

      - name: upload failures list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.slug }}-${{ matrix.chunk }}
          path: failures.txt
          if-no-files-found: ignore
