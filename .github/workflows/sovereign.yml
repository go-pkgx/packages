name: sovereign build

# Proof that a recipe can be compiled with NO distribution involved: the rootfs
# `bk builder` stages from builder/toolchain.txt, entered with chroot, bk run
# through pkgx exactly as builder/Containerfile's ENTRYPOINT does.
#
# Why this exists: with the ordinary path, what can be built is decided by the
# runner's distribution. Measured, twice, on our own pool:
#
#   * on debian 12 every compile died at `env: … version GLIBC_2.38 not found`,
#     because bk installs a MIRRORED coreutils linked against a newer glibc;
#   * on debian 13 the first recipe through, jonas.github.io/tig, failed on a
#     C23 diagnostic from the runner's GCC — not from the llvm.org bottle we
#     ship and intend to compile with.
#
# Both are the same defect wearing different clothes. go-pkgx owns its build and
# run environment and manages its own libc versions; this is what that looks
# like as a job.

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: "space-separated projects to build inside the sovereign rootfs"
        required: false
        default: "lz4.org"
      versions:
        description: "pkgx constraint; a BARE version is a RANGE, use '=1.2.3' for exactly one"
        required: false
        default: "=1.10.0"
      force:
        description: "rebuild even when the bottle is already published (blank = skip). The point of this job is to COMPILE, and a skipped build proves nothing."
        required: false
        default: "1"
      arch:
        description: "`x86-64` (default) or `aarch64`"
        required: false
        default: "x86-64"

permissions:
  contents: read
  packages: write

jobs:
  sovereign:
    runs-on: ${{ github.event.inputs.arch == 'aarch64' && fromJSON('["self-hosted","incus","arm64"]') || fromJSON('["self-hosted","incus","amd64"]') }}
    timeout-minutes: 330
    env:
      PLATFORM: linux/${{ github.event.inputs.arch || 'x86-64' }}
    steps:
      # The host's only jobs are: run three static Go binaries, and hold a mount
      # namespace. Nothing it links against reaches the build.
      - name: host tools
        run: |
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          command -v git >/dev/null || { $SUDO apt-get update -qq; $SUDO apt-get install -y --no-install-recommends git ca-certificates; }

      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }

      - name: build bk, pkgx and pkgm (static)
        run: |
          for m in bk/cmd/bk pkgx pkgm; do
            CGO_ENABLED=0 GOPROXY=direct go install "github.com/go-pkgx/$m@main"
          done
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: clone pantry
        run: git clone --depth 1 https://github.com/pkgxdev/pantry

      # A directory, not an image: builder/README.md's primitive. --container
      # writes /etc/ld.so.conf listing every staged library directory, without
      # which /bin/sh inside the tree cannot find libc.
      # A zot pull-through cache runs on the pool host, bound to the Incus
      # bridge. Staging the toolchain pulls ~2 GiB (llvm.org alone is ~1.7), and
      # every job on this machine would otherwise pull it from ghcr again.
      # Detected rather than configured: a GitHub-hosted runner cannot reach
      # 10.46.81.1 and simply keeps ghcr. Signature verification is unaffected —
      # zot proxies the cosign referrer along with the bottle.
      - name: point at the pull-through cache if it answers
        run: |
          DIST=oci://ghcr.io/go-pkgx/packages
          if curl -fsS -m 3 http://10.46.81.1:5111/v2/ >/dev/null 2>&1; then
            DIST=oci://http://10.46.81.1:5111/go-pkgx/packages
            echo "pull-through cache answers — installing through it"
          else
            echo "no cache on this runner — installing from ghcr"
          fi
          echo "PKGX_DIST=$DIST" >> "$GITHUB_ENV"

      - name: stage the sovereign rootfs
        env:
          PKGX_PANTRY_OVERLAY: https://raw.githubusercontent.com/go-pkgx/pantry-overlay/main/projects
        run: |
          bk builder \
            --out "$RUNNER_TEMP/rootfs" \
            --platform "$PLATFORM" \
            --toolchain builder/toolchain.txt \
            --bk "$(command -v bk)" \
            --pkgx "$(command -v pkgx)" \
            --container
          du -sh "$RUNNER_TEMP/rootfs"

      - name: what the rootfs is made of
        run: |
          root="$RUNNER_TEMP/rootfs"
          echo "top level:"; ls "$root"
          # The claim to check is a negative one: no distribution in there.
          for d in usr/lib/x86_64-linux-gnu lib/x86_64-linux-gnu lib/aarch64-linux-gnu etc/debian_version etc/os-release; do
            [ -e "$root/$d" ] && echo "  UNEXPECTED: $d" || true
          done
          echo "the loader the tree will actually use:"
          ls -l "$root/lib64" "$root/lib" 2>/dev/null | grep -i "ld-linux" || true
          echo "glibc staged:"; find "$root" -maxdepth 5 -type d -name "glibc*" 2>/dev/null | head -3

      - name: build + publish inside the rootfs
        env:
          OCI_USERNAME: ${{ github.actor }}
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.BOTTLE_SIGNING_KEY }}
          # builder/Containerfile's ENV lines, not just its ENTRYPOINT. Without
          # PKGX_DIR the chroot inherits pkgx's $HOME/.pkgx default, which
          # (a) re-downloads the toolchain the staged tree already holds and
          # (b) bakes PT_INTERP=/root/.pkgx/... into the bottle — an absolute
          # path no consumer has. Measured on the first bottle this job built.
          PKGX_DIR: /pkgx
          HOME: /root
          PKGX_PANTRY_OVERLAY: https://raw.githubusercontent.com/go-pkgx/pantry-overlay/main/projects
          # Our aarch64 pool is emulated by construction — the host is amd64 —
          # and qemu-user fakes uname and /proc/cpuinfo, so nothing inside the
          # container can tell. The workflow knows, so it says.
          # With one make job per CPU (32) bash stops being able to allocate:
          #   /bin/sh: xmalloc: hashlib.c:72: cannot allocate 8192 bytes
          JOBS: ${{ github.event.inputs.arch == 'aarch64' && '4' || '' }}
          RECIPES: ${{ github.event.inputs.recipes || 'lz4.org' }}
          VERSIONS: ${{ github.event.inputs.versions || '=1.10.0' }}
          # Without this the first green run reported "0 built, 15 skipped —
          # already published": the whole chain ran and compiled nothing.
          FORCE: ${{ github.event.inputs.force || '1' }}
        run: |
          builder/sovereign-build.sh \
            "$RUNNER_TEMP/rootfs" "$PWD/pantry" "$PWD/overrides" \
            ${VERSIONS:+--versions "$VERSIONS"}

      - name: upload dist tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-dist-${{ github.event.inputs.arch || 'x86-64' }}
          path: ${{ runner.temp }}/rootfs/dist
          if-no-files-found: warn
