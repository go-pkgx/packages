# wasip1/wasm package factory (C/C++) — builds projects for wasm32-wasip1 with OUR
# toolchain INSIDE THE SOVEREIGN ROOTFS and publishes them to
# ghcr.io/go-pkgx/packages with OCI platform os=wasip1, architecture=wasm.
# Sibling of wasip1.yml (Go).
#
# The toolchain is not a prebuilt wasi-sdk: it is the llvm.org bottle (clang,
# wasm-ld, llvm-ar) plus bottles built from source in the pantry overlay,
# compiler-rt.llvm.org/wasi (builtins + clang headers as a resource dir),
# github.com/WebAssembly/wasi-libc (the sysroot) and libcxx.llvm.org/wasi
# (libc++, libc++abi). `bk --platform wasip1/wasm build` adds them to the
# dependency eval and imposes the stencil through $BK_CC/$BK_CXX
# (clang --target=wasm32-wasip1 --sysroot=… -resource-dir=… -mcpu=lime1
# --rtlib=compiler-rt), which the cc/gcc/clang shims re-exec, so a recipe cannot
# lose it by setting CFLAGS or CC.
#
# SOVEREIGN: the build runs in the rootfs `bk builder` stages from
# builder/toolchain.txt, entered with unshare+chroot (builder/sovereign-bk.sh),
# so make, sh, coreutils, clang and wasm-ld all come from bottles in that tree and
# nothing from the runner's distribution takes part. The runner contributes three
# static Go binaries, a mount namespace and — to RUN the result — wasmtime, which
# is the runtime under test, not a build tool. The "what ran, from where" step
# prints the resolved path of every tool the build uses.
#
# Recipes: wasip1/recipes/<slug>/package.yml — the wasm build of each project is
# its own small recipe (static, no dlopen, no threads), not a conditional in the
# host recipe. Every module is RUN under wasmtime before it is published.
#
# workflow_dispatch only, like the other factories.
name: wasip1-c
on:
  workflow_dispatch:
permissions: { contents: read, packages: write }
env:
  GOPROXY: https://proxy.golang.org,direct
  GONOPROXY: github.com/go-pkgx/*
  PKGX_DIST: oci://ghcr.io/go-pkgx/packages
  PKGX_PANTRY_OVERLAY: https://raw.githubusercontent.com/go-pkgx/pantry-overlay/main/projects

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # 22 jobs (11 projects x 2 build hosts). Parallel matrices in this repository
      # have starved other lanes (37 concurrent jobs caused cancellations), so at
      # most 4 run at once: the longest build (jq + vendored oniguruma) is minutes.
      max-parallel: 4
      matrix:
        include:
          # bin: the module under <prefix>/bin; smoke: its arguments under wasmtime
          # (run in an empty directory holding t.txt); stdin: the file it reads.
          # minigzip with no argument compresses stdin to stdout. The lua smoke
          # raises and catches an error: lua throws with longjmp, which here is
          # the wasm exception-handling instructions (wasi-sdk SetjmpLongjmp.md),
          # so it proves the engine runs them, not just that the module starts.
          - { runner: ubuntu-latest, platform: linux/x86-64, slug: zlib.net, version: "1.3.2", bin: minigzip, smoke: "", stdin: t.txt }
          - { runner: ubuntu-latest, platform: linux/x86-64, slug: lua.org, version: "5.4.9", bin: lua, smoke: '-e "assert(not pcall(error, 1)); assert(_VERSION == [[Lua 5.4]])"', stdin: /dev/null }
          - { runner: ubuntu-latest, platform: linux/x86-64, slug: sqlite.org, version: "3.53.4", bin: sqlite3, smoke: ':memory: "select sqlite_version();"', stdin: /dev/null }
          # the C++ pilot: libc++ from libcxx.llvm.org/wasi; reads j.json (JSON).
          - { runner: ubuntu-latest, platform: linux/x86-64, slug: github.com/simdjson/simdjson, version: "5.0.5", bin: simdjson-minify, smoke: "", stdin: j.json }
          # Compressors, regex, XML and JSON tools (C). Each smoke is one wasmtime
          # run that must exit 0; $PWD below is expanded by the smoke step's shell,
          # because the module resolves relative paths against nothing but PWD+--dir=/.
          # lz4 -b1 -i1 compresses AND decompresses the file in memory (benchmark),
          # which a stdin->stdout compress would not: lz4 -d once trapped on the stack.
          - { runner: ubuntu-latest, platform: linux/x86-64, slug: sourceware.org/bzip2, version: "1.0.8", bin: bzip2, smoke: "-9", stdin: t.txt }
          - { runner: ubuntu-latest, platform: linux/x86-64, slug: facebook.com/zstd, version: "1.5.7", bin: zstd, smoke: "-c", stdin: t.txt }
          - { runner: ubuntu-latest, platform: linux/x86-64, slug: lz4.org, version: "1.10.0", bin: lz4, smoke: '-b1 -i1 "$PWD/t.txt"', stdin: /dev/null }
          - { runner: ubuntu-latest, platform: linux/x86-64, slug: github.com/google/brotli, version: "1.2.1", bin: brotli, smoke: "", stdin: t.txt }
          - { runner: ubuntu-latest, platform: linux/x86-64, slug: pcre.org/v2, version: "10.49", bin: pcre2grep, smoke: '"[0-9]+"', stdin: t.txt }
          - { runner: ubuntu-latest, platform: linux/x86-64, slug: libexpat.github.io, version: "2.9.0", bin: xmlwf, smoke: "", stdin: x.xml }
          - { runner: ubuntu-latest, platform: linux/x86-64, slug: stedolan.github.io/jq, version: "1.8.2", bin: jq, smoke: '-e ".a[1] == 2"', stdin: j.json }
          # linux/aarch64: the same rootfs, staged for aarch64 on GitHub's native
          # arm runner. The toolchain bottles (compiler-rt, wasi-libc, libcxx) are
          # published for linux/aarch64 hosts too; the wasm they produce is the same.
          - { runner: ubuntu-24.04-arm, platform: linux/aarch64, slug: zlib.net, version: "1.3.2", bin: minigzip, smoke: "", stdin: t.txt }
          - { runner: ubuntu-24.04-arm, platform: linux/aarch64, slug: lua.org, version: "5.4.9", bin: lua, smoke: '-e "assert(not pcall(error, 1)); assert(_VERSION == [[Lua 5.4]])"', stdin: /dev/null }
          - { runner: ubuntu-24.04-arm, platform: linux/aarch64, slug: sqlite.org, version: "3.53.4", bin: sqlite3, smoke: ':memory: "select sqlite_version();"', stdin: /dev/null }
          - { runner: ubuntu-24.04-arm, platform: linux/aarch64, slug: github.com/simdjson/simdjson, version: "5.0.5", bin: simdjson-minify, smoke: "", stdin: j.json }
          - { runner: ubuntu-24.04-arm, platform: linux/aarch64, slug: sourceware.org/bzip2, version: "1.0.8", bin: bzip2, smoke: "-9", stdin: t.txt }
          - { runner: ubuntu-24.04-arm, platform: linux/aarch64, slug: facebook.com/zstd, version: "1.5.7", bin: zstd, smoke: "-c", stdin: t.txt }
          - { runner: ubuntu-24.04-arm, platform: linux/aarch64, slug: lz4.org, version: "1.10.0", bin: lz4, smoke: '-b1 -i1 "$PWD/t.txt"', stdin: /dev/null }
          - { runner: ubuntu-24.04-arm, platform: linux/aarch64, slug: github.com/google/brotli, version: "1.2.1", bin: brotli, smoke: "", stdin: t.txt }
          - { runner: ubuntu-24.04-arm, platform: linux/aarch64, slug: pcre.org/v2, version: "10.49", bin: pcre2grep, smoke: '"[0-9]+"', stdin: t.txt }
          - { runner: ubuntu-24.04-arm, platform: linux/aarch64, slug: libexpat.github.io, version: "2.9.0", bin: xmlwf, smoke: "", stdin: x.xml }
          - { runner: ubuntu-24.04-arm, platform: linux/aarch64, slug: stedolan.github.io/jq, version: "1.8.2", bin: jq, smoke: '-e ".a[1] == 2"', stdin: j.json }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      # The host's only jobs: run three static Go binaries and hold a namespace.
      - name: build bk, pkgx and pkgm (static)
        run: |
          CGO_ENABLED=0 go install github.com/go-pkgx/bk/cmd/bk@v0.41.0
          CGO_ENABLED=0 go install github.com/go-pkgx/pkgx@main
          CGO_ENABLED=0 go install github.com/go-pkgx/pkgm@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: stage the sovereign rootfs
        run: |
          sudo rm -rf "$RUNNER_TEMP/rootfs"
          bk builder \
            --out "$RUNNER_TEMP/rootfs" \
            --platform "${{ matrix.platform }}" \
            --toolchain builder/toolchain.txt \
            --bk "$(command -v bk)" \
            --pkgx "$(command -v pkgx)" \
            --container
      # The claim to check is a negative one: no distribution in the tree. The
      # build below runs `chroot` into it, so these are the only files it sees.
      - name: what the rootfs is made of
        run: |
          ls "$RUNNER_TEMP/rootfs"
          ls "$RUNNER_TEMP/rootfs/etc"
      - name: build ${{ matrix.slug }} ${{ matrix.version }} for wasip1/wasm, in the rootfs
        run: |
          chmod +x builder/sovereign-bk.sh
          builder/sovereign-bk.sh "$RUNNER_TEMP/rootfs" "$PWD/wasip1/recipes" "$PWD/advisories" \
            /usr/local/bin/bk --platform wasip1/wasm build --libc=pkgx \
            --recipe "/recipes/${{ matrix.slug }}/package.yml" --version "${{ matrix.version }}" \
            --dist /dist "${{ matrix.slug }}"
      # WHAT RAN, FROM WHERE: the program resolved for every tool a build uses,
      # in the same chroot, through the same pkgx environment the build had.
      # Anything under /pkgx came from a bottle in the rootfs; /bin and /usr are
      # the rootfs's own (staged from the same toolchain list), never the runner's.
      # A name that prints nothing is a tool that is NOT there.
      - name: what ran, from where
        run: |
          builder/sovereign-bk.sh "$RUNNER_TEMP/rootfs" "$PWD/wasip1/recipes" "$PWD/advisories" \
            /bin/sh -c 'command -v sh make install cp clang clang++ wasm-ld llvm-ar llvm-ranlib cc gcc; echo "PATH=$PATH"'
      - name: smoke under wasmtime
        run: |
          mkdir smoke && cd smoke
          printf 'hello wasip1\n' > t.txt
          printf '{ "a" : [1, 2 ] }\n' > j.json
          printf '<a x="1"><b>hi</b></a>\n' > x.xml
          mod="$RUNNER_TEMP/rootfs/pkgx/${{ matrix.slug }}/v${{ matrix.version }}/bin/${{ matrix.bin }}.wasm"
          ls -l "$mod"
          wasmtime run --dir=/ --env PWD="$PWD" "$mod" ${{ matrix.smoke }} < ${{ matrix.stdin }} > /dev/null
      - name: publish ${{ matrix.slug }} to ghcr (wasip1/wasm), from the rootfs
        env:
          OCI_USERNAME: ${{ github.actor }}
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.BOTTLE_SIGNING_KEY }}
        run: |
          SIGN_ARGS=()
          if [ -n "${SIGNING_KEY:-}" ]; then
            umask 077; printf '%s' "$SIGNING_KEY" | sudo tee "$RUNNER_TEMP/rootfs/sign.key" > /dev/null
            SIGN_ARGS=(--sign /sign.key); echo "signing: enabled"
          fi
          SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-1700000000}" \
            builder/sovereign-bk.sh "$RUNNER_TEMP/rootfs" "$PWD/wasip1/recipes" "$PWD/advisories" \
              /usr/local/bin/bk publish --to oci://ghcr.io/go-pkgx/packages --project "${{ matrix.slug }}" \
              --version "${{ matrix.version }}" --platform wasip1/wasm "${SIGN_ARGS[@]}" \
              --advisories /advisories \
              "/dist/${{ matrix.slug }}/wasip1/wasm/v${{ matrix.version }}.tar.zst"
