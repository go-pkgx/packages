# wasip1/wasm package factory (Go) — cross-builds pure-Go pantry projects to a
# WASI preview-1 module and publishes them to the signed OCI registry
# ghcr.io/go-pkgx/packages with OCI platform os=wasip1, architecture=wasm (the
# Docker+Wasm / CNCF wasm-oci-artifact spelling; bottle/oci.go passes the arch
# `wasm` through unchanged). Consumer: an in-browser container engine.
#
# Same recipe as windows.yml — GOOS cross build, tar, `bk publish` — except:
#   - GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0: Go-only, no C toolchain (wasi-sdk /
#     wasi-libc projects are NOT part of this target).
#   - the module is staged as bin/<name>.wasm. A recipe's `provides: bin/<name>`
#     stays extension-free and bottle.ResolveBinPath finds the .wasm on a wasm
#     host, exactly as it finds foo.exe on windows.
#   - every bottle is RUN under wasmtime before it is published: a module that
#     builds but does not start is not a package.
#   - the pilot list is explicit (slug, tag, main package), not derived. `go build
#     -o f .` on a LIBRARY writes an archive and exits 0, and the shell fallback
#     chain windows.yml uses cannot tell it from an executable.
#
# Trigger: workflow_dispatch only, like the other factories, so landing this
# file does not fire a run.
name: wasip1
on:
  workflow_dispatch:
permissions: { contents: read, packages: write }
env:
  # Deps from the module proxy, OUR modules straight from GitHub; kept uniform
  # across the workflows by ./goproxycheck.
  GOPROXY: https://proxy.golang.org,direct
  GONOPROXY: github.com/go-pkgx/*
  BK: github.com/go-pkgx/bk/cmd/bk@v0.35.0

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each entry was built for wasip1/wasm and checked for the \0asm magic
          # before it was listed; the smoke arguments are what CI runs under
          # wasmtime. `pkg` is the main package: root for go-md2man, cmd/<bin>
          # for the others.
          - { slug: filippo.io/age, repo: FiloSottile/age, version: "1.3.2", pkg: "./cmd/age", bin: age, smoke: "--version" }
          - { slug: github.com/cpuguy83/go-md2man, repo: cpuguy83/go-md2man, version: "2.0.7", pkg: ".", bin: go-md2man, smoke: "-in t.md" }
          - { slug: mvdan.cc/sh, repo: mvdan/sh, version: "3.14.1", pkg: "./cmd/shfmt", bin: shfmt, smoke: "--version" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: install bk
        run: |
          go install "$BK"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: clone ${{ matrix.slug }} v${{ matrix.version }}
        run: git clone --depth 1 --branch "v${{ matrix.version }}" "https://github.com/${{ matrix.repo }}" src
      - name: build wasip1/wasm
        working-directory: src
        env:
          GOOS: wasip1
          GOARCH: wasm
          CGO_ENABLED: "0"
        run: go build -trimpath -o "$RUNNER_TEMP/${{ matrix.bin }}.wasm" "${{ matrix.pkg }}"
      - name: smoke under wasmtime
        # The directory is granted explicitly (WASI has no ambient filesystem).
        # The guest's arguments follow the module path with NO `--`: wasmtime 50
        # hands a `--` to the guest as argv[1] (shfmt then tried to lstat
        # "--version"), whatever $GOROOT/lib/wasm/go_wasip1_wasm_exec does.
        run: |
          mkdir smoke && cd smoke
          printf '# Title\n\nbody\n' > t.md
          wasmtime run --dir=. "$RUNNER_TEMP/${{ matrix.bin }}.wasm" ${{ matrix.smoke }}
      - name: publish ${{ matrix.slug }} to ghcr (wasip1/wasm)
        env:
          OCI_USERNAME: ${{ github.actor }}
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.BOTTLE_SIGNING_KEY }}
        run: |
          slug="${{ matrix.slug }}"; ver="${{ matrix.version }}"
          stage="stage/$slug/v$ver/bin"; mkdir -p "$stage"
          cp "$RUNNER_TEMP/${{ matrix.bin }}.wasm" "$stage/${{ matrix.bin }}.wasm"
          mkdir -p out
          tar -czf "out/v$ver.tar.gz" -C stage "$slug/v$ver"
          SIGN_ARGS=()
          if [ -n "${SIGNING_KEY:-}" ]; then
            umask 077; KEYFILE="$(mktemp)"; printf '%s' "$SIGNING_KEY" > "$KEYFILE"
            SIGN_ARGS=(--sign "$KEYFILE"); echo "signing: enabled"
          else
            echo "signing: disabled (no SIGNING_KEY)"
          fi
          # Not best-effort, unlike windows.yml: the pilot exists to prove the
          # path, so a publish failure fails the job.
          SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-1700000000}" \
            bk publish --to oci://ghcr.io/go-pkgx/packages --project "$slug" \
              --version "$ver" --platform wasip1/wasm "${SIGN_ARGS[@]}" \
              --advisories "$GITHUB_WORKSPACE/advisories" \
              "out/v$ver.tar.gz"
