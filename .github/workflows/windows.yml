# Windows package factory (Go) — cross-builds pantry Go projects to Windows PE
# packages and publishes them to BOTH channels, exactly like linux/darwin:
#   - the signed OCI registry ghcr.io/go-pkgx/packages (via `bk publish`), and
#   - the GitHub Pages pkgx dist mirror (via the central pages.yml aggregator,
#     which unions the `dist-*` artifact this job uploads).
# Go tools cross-build to Windows for free (GOOS=windows CGO_ENABLED=0 → a
# self-contained .exe, no libc, no DLLs), so a large slice of the pantry becomes
# Windows packages with no per-recipe work.
#
# Trigger mirrors build.yml (the linux factory): workflow_dispatch + a daily
# schedule, NOT on:push — so landing this file does not immediately fire a run.
name: windows
on:
  workflow_dispatch:
  # schedule:  # cron disabled 2026-08-12 (free runners for targeted jobs; workflow_dispatch kept)
    # Staggered after the ghcr factories (linux 06:00, darwin 07:00). Go runs
    # before Rust (08:00 < 09:00). The Pages mirror is deployed later by pages.yml.
    # - cron: "0 8 * * *"
permissions: { contents: read, packages: write }
env:
  CHUNK: "25"   # projects per matrix job (chunked so we scale past the 256-job matrix cap)

jobs:
  setup:
    # Our own GARM/Incus pool: 32 cores, ephemeral container per job, tagged
    # [self-hosted, incus, amd64]. Linux work runs here rather than on GitHub's
    # minutes. If the pool is down, jobs queue — swap this line back to
    # `ubuntu-latest` to get moving again.
    runs-on: [self-hosted, incus, amd64]
    outputs:
      chunks: ${{ steps.gen.outputs.chunks }}
    steps:
      # The Incus runner image is a plain Debian cloud image: no jq, no git, no
      # go. setup-go brings its own, checkout falls back to the API tarball, and
      # jq is one apt line. A no-op wherever it is already there.
      - name: jq
        run: command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq; }
      - uses: actions/checkout@v4
      - id: gen
        run: |
          total=$(grep -c . windows/go-projects.txt)
          n=$(( (total + CHUNK - 1) / CHUNK ))
          echo "chunks=$(seq 0 $((n-1)) | jq -R . | jq -c -s .)" >> "$GITHUB_OUTPUT"
          echo "$total projects → $n chunks of $CHUNK"

  build:
    needs: setup
    # Our own GARM/Incus pool: 32 cores, ephemeral container per job, tagged
    # [self-hosted, incus, amd64]. Linux work runs here rather than on GitHub's
    # minutes. If the pool is down, jobs queue — swap this line back to
    # `ubuntu-latest` to get moving again.
    runs-on: [self-hosted, incus, amd64]
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        chunk: ${{ fromJson(needs.setup.outputs.chunks) }}
    steps:
      # The Incus runner image is a plain Debian cloud image: no jq, no git, no
      # go. setup-go brings its own, checkout falls back to the API tarball, and
      # jq is one apt line. A no-op wherever it is already there.
      - name: jq
        run: command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq; }
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: install pkgx + bk (for signed OCI publish)
        run: |
          curl -fsS https://pkgx.sh | sh
          for d in "$HOME/.local/bin" /usr/local/bin; do
            [ -x "$d/pkgx" ] && { echo "$d" >> "$GITHUB_PATH"; break; }
          done
          # GOPROXY=direct: pull current main from GitHub, not a stale proxy cache.
          GOPROXY=direct go install github.com/go-pkgx/bk/cmd/bk@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Cross-build chunk ${{ matrix.chunk }} → Windows packages
        env:
          OCI_USERNAME: ${{ github.actor }}
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.BOTTLE_SIGNING_KEY }}
        run: |
          start=$(( ${{ matrix.chunk }} * CHUNK + 1 )); end=$(( start + CHUNK - 1 ))
          # Signing key → temp file, as factory.sh does; skip --sign if unset.
          SIGN_ARGS=()
          if [ -n "${SIGNING_KEY:-}" ]; then
            umask 077; KEYFILE="$(mktemp)"; printf '%s' "$SIGNING_KEY" > "$KEYFILE"
            SIGN_ARGS=(--sign "$KEYFILE"); echo "signing: enabled"
          else
            echo "signing: disabled (no SIGNING_KEY)"
          fi
          sed -n "${start},${end}p" windows/go-projects.txt | while IFS='|' read -r slug repo bin; do
            [ -n "$slug" ] || continue
            echo "::group::$slug ($repo, bin=$bin)"
            rm -rf src
            ver=$(git ls-remote --tags --refs "https://github.com/$repo" 2>/dev/null \
                  | awk -F/ '{print $NF}' | sed 's/^v//' \
                  | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -1)
            if [ -z "$ver" ]; then echo "no tag; skip"; echo "::endgroup::"; continue; fi
            git clone --depth 1 --branch "v$ver" "https://github.com/$repo" src 2>/dev/null \
              || git clone --depth 1 --branch "$ver" "https://github.com/$repo" src 2>/dev/null \
              || { echo "clone failed; skip"; echo "::endgroup::"; continue; }
            ( cd src
              export GOOS=windows GOARCH=amd64 CGO_ENABLED=0
              out="/tmp/$bin.exe"; rm -f "$out"
              ( go build -o "$out" . \
                || go build -o "$out" "./cmd/$bin" \
                || { m=$(go list -f '{{if eq .Name "main"}}{{.Dir}}{{end}}' ./... 2>/dev/null | head -1); [ -n "$m" ] && go build -o "$out" "$m"; } ) 2>/tmp/err || true
            )
            out="/tmp/$bin.exe"
            if [ ! -f "$out" ]; then echo "no windows build"; echo "::endgroup::"; continue; fi
            stage="stage/$slug/v$ver/bin"; rm -rf stage; mkdir -p "$stage"; cp "$out" "$stage/$bin.exe"
            d="$GITHUB_WORKSPACE/out/$slug/windows/x86-64"; mkdir -p "$d"
            tar -czf "$d/v$ver.tar.gz" -C stage "$slug/v$ver"
            echo "$ver" > "$d/versions.txt"
            mkdir -p "$GITHUB_WORKSPACE/out/$slug"
            printf 'provides:\n  - bin/%s\n' "$bin" > "$GITHUB_WORKSPACE/out/$slug/package.yml"
            # Publish the same package to the signed OCI registry (best-effort:
            # a publish failure must not abort the chunk). windows/x86-64 is as
            # os/arch-generic to `bk publish` as linux/darwin are.
            if SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-1700000000}" \
               bk publish --to oci://ghcr.io/go-pkgx/packages --project "$slug" \
                 --version "$ver" --platform windows/x86-64 "${SIGN_ARGS[@]}" \
                 "$d/v$ver.tar.gz"; then
              echo "published $slug $ver → OCI"
            else
              echo "OCI publish failed for $slug (non-fatal)"
            fi
            echo "OK $slug v$ver"; echo "::endgroup::"
          done
      # Upload the dist tree for the central pages.yml aggregator to union into
      # the GitHub Pages mirror. Named `dist-*` so pages.yml discovers it.
      - uses: actions/upload-artifact@v4
        if: hashFiles('out/**') != ''
        with:
          name: dist-windows-go-${{ matrix.chunk }}
          path: out
          if-no-files-found: ignore
