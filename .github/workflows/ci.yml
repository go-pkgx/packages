name: ci

# The Go in this repo is not a side-show: `catalog` IS the index-audit gate that
# runs at 04:00 and fails the day a published bottle drops out of its index,
# `browsergw` is the CORS front the browser package store talks through, and
# `openssl3` generates the override patches the factory applies. Until this lane
# existed, nothing compiled or tested any of it before merge — a change that
# broke `go run ./catalog` would have been discovered by the audit, in
# production, at four in the morning.

on:
  push: { branches: [main] }
  pull_request:

permissions: { contents: read }

jobs:
  # A workflow that triggers on `pull_request` must NOT run on a self-hosted
  # runner. For that event GitHub runs the workflow file from the PR's HEAD, so
  # a fork can add a job naming any label it likes and execute its code on our
  # machines. The label is not a boundary.
  #
  # This used to say [self-hosted, incus, amd64] — 32 cores, an ephemeral
  # container per job — and the speed was real. It is not worth the exposure:
  # `go vet`, gofmt and `go test` on this tree fit a hosted runner, and the
  # pool stays for build.yml, which is workflow_dispatch and schedule only.
  #
  # The default fork-PR policy on a public repository is "require approval for
  # first-time contributors", which does NOT close this: a contributor whose
  # first PR was merged then runs without approval. Moving off self-hosted
  # removes the intersection instead of gating it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.2' }
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      # The overrides are HCL now, and say WHAT they change rather than where
      # the lines are — so "it stopped applying" has become three answers
      # instead of one: the recipe needed it, upstream has caught up (delete
      # it), or what it edits is gone (an error). The last two were spelled the
      # same by a unified diff, and 3 of 231 had silently stopped on
      # 2026-09-24, among them the -Werror switch mozilla.org/nss needs, whose
      # absence cost two rebuilds and a duplicate fix for a defect that was
      # already fixed.
      #
      # Eight *.patch files remain and are a different thing entirely: they
      # CREATE a project, so they are recipes of ours, not overrides.
      #
      # `bk overrides` uses the applier the BUILDER uses — overrides.Apply, on
      # go-gitdiff — and that is the whole point of running it rather than
      # `git apply --check`. git searches for a patch's context with an offset
      # and go-gitdiff does not, so the two disagree: on 2026-09-27 git passed
      # a patch the builder refused, and it was merged.
      #
      # A FRESH clone every time, because a patch already applied does not
      # apply twice.
      - name: every override still applies
        run: |
          rm -rf "$RUNNER_TEMP/pantry"
          git clone --depth 1 https://github.com/pkgxdev/pantry "$RUNNER_TEMP/pantry"
          # GOPROXY=direct: a proxy-cached `@main` can be an older bk, and
          # "unknown subcommand" is a confusing way to learn that.
          GOPROXY=direct go run github.com/go-pkgx/bk/cmd/bk@main overrides \
            --dir overrides --pantry "$RUNNER_TEMP/pantry"

      # The step above leaves a pantry with every override applied — which is
      # the recipe the FACTORY builds. The overlay is the recipe a CONSUMER
      # resolves from, and for the 183 projects in both, the overlay wins
      # entirely. So the two can part, and 25 of them have.
      #
      # This gates only the half a consumer reads — `dependencies`, `provides`,
      # `versions`, `distributable`. The other 23 are our own override patches
      # showing through, and nothing reads a build section out of the overlay;
      # failing on those would mean mirroring every patch into a second tree
      # forever.
      #
      # It exists because one consumer-side difference was live and served:
      # tcl-lang.org enumerated versions from a page listing only what upstream
      # currently recommends, while its own distributable downloaded from
      # SourceForge — the inconsistency upstream's pantry had been corrected
      # for. It had been reported for as long as the tool existed, as
      # `..build.script: 15 items became 14`, because the comparison returned
      # the first difference in sorted key order and `build` sorts first.
      # The overrides are being moved from unified diffs to the logical HCL
      # form (go-pkgx/bk#226): a diff says WHERE lines are and stops applying
      # when upstream edits a neighbour, while an override that says WHAT it
      # changes is addressed by key. 3 of 231 diffs had silently stopped
      # applying on 2026-09-24, and one that `git apply --check` accepted was
      # refused by the builder and merged broken on 2026-09-27.
      #
      # The conversion is done, so this now reports "nothing to convert" and
      # passes. It stays because it is the net under the next unified diff
      # anybody adds: it derives the operations from the patch, writes them
      # out, READS THEM BACK, applies them to a pristine recipe, and demands
      # the same document the patch produced — and demands that applying them
      # TWICE changes nothing, which is the property 24 operations across 22
      # projects failed before go-pkgx/bk#229.
      #
      # It clones its own pantry rather than reusing the one above, which by
      # this point has been patched.
      - name: any unified diff left is convertible, and the conversion is faithful
        run: go run ./logicalise

      # A project upstream does not carry lives in ONE place now: the overlay,
      # which bk builds from and a consumer resolves from (go-pkgx/bk#231). It
      # used to live in two — a patch that created the recipe, and the overlay
      # — and four such projects were published, signed and unreachable to any
      # consumer because only the build half existed. Nothing said so: the
      # bottles were there, and only a RECIPE fetch would have failed.
      #
      # That risk is not gone, it has moved: the overlay's copy has to be
      # SERVED. A checkout can be right while the contents API still returns
      # the old state — raw.githubusercontent holds a file for minutes and
      # nothing dislodges it — so this asks the API for the eight, and compares
      # the other 175 against the recipe the factory builds.
      # A `why` that points at the git history is not a why. The converter's
      # fallback wrote one for every override it could not map to a generated
      # family, and 59 of the 206 carried it — 29% of the directory telling the
      # reader to go to the one place nobody looks. Every one of them was
      # recoverable: `git log --diff-filter=A -- overrides/<name>.patch` had the
      # reason, often in the subject line alone.
      #
      # The format exists to carry the WHY beside the WHAT. This is the crudest
      # possible check of that and it is still worth having, because the way
      # the placeholder came back would be a tool writing it, not a person.
      - name: no override defers its reason to the git history
        run: |
          if grep -l "the reason is in the git history" overrides/*.hcl; then
            echo "::error::the overrides above say where to look instead of saying why."
            echo "Recover it: git log --diff-filter=A --all -- overrides/<name>.patch"
            exit 1
          fi
          echo "$(ls overrides/*.hcl | wc -l) override(s), none deferring its reason"

      - name: the half a consumer resolves from agrees
        run: |
          rm -rf "$RUNNER_TEMP/overlay"
          git clone --depth 1 https://github.com/go-pkgx/pantry-overlay "$RUNNER_TEMP/overlay"
          # --overrides, because the pantry on disk is no longer the recipe
          # the factory builds: the logical overrides are applied as a recipe
          # is READ and change nothing on the filesystem. Without it this
          # compared the overlay against an UNOVERRIDDEN recipe and reported
          # 180 disagreements, every one of them ours.
          go run ./overlaycheck --pantry "$RUNNER_TEMP/pantry" --overlay "$RUNNER_TEMP/overlay" --overrides overrides

      # The seed order is a human artefact with a machine-checkable property.
      # An order over a graph with CYCLES is not a topological sort — there is
      # none — it is a topological sort of everything else plus a choice of
      # which edges to give up on. Inside a cycle that choice is unavoidable;
      # between two cycles nothing forces it, and this gates only the second.
      #
      # It is not a formality. The first run of it, 2026-09-28, found two:
      # rust-lang.org and rust-lang.org/cargo both ordered before llvm.org,
      # which is in a different component. That was the live seed failure of
      # that day — `cargo: resolve deps: GET .../llvm.org/.../versions.txt: Not
      # Found` — with two more cascading from it, and the file had been edited
      # by hand for weeks with nothing able to say so.
      # The seed reached 77 of 77 on 2026-09-29 and was not a usable
      # toolchain: the first build on top of it without --bootstrap died on
      # `no version of gnu.org/gawk satisfies "~5.3"`. The seed had built
      # 5.4.1 — the newest — and bk pins ~5.3 on purpose, because 5.4.1
      # mishandles autoconf's option-resolution scripts. The order named
      # projects and not versions, so it took the latest and nothing said
      # otherwise. "Every project published" was true and answered the wrong
      # question.
      #
      # The constraint is READ FROM bk (build.BaseToolchain), never copied:
      # a second "~5.3" in this repository would be right until bk moved and
      # then wrong silently, which is the same defect one layer up.
      #
      # TWO lists, because the same defect happened again on 2026-10-04 in the
      # other one. builder/toolchain.txt pinned kernel.org/linux-headers@~7.1;
      # the order named the project with no version, so the seed built 7.2.8,
      # and the first sovereign s390x build died in 22 seconds on
      #   no version of kernel.org/linux-headers satisfies "~7.1"
      # — exactly the shape this step refuses, which passed because it was
      # reading bk's list alone. A check aimed at one of two sources is worse
      # than none: it reports agreement.
      - name: the seed order builds the toolchain the toolchain wants
        run: go run ./seedpins --order seed/order.txt --builder-toolchain builder/toolchain.txt

      - name: the seed order honours every edge outside a cycle
        run: |
          GOPROXY=direct go run github.com/go-pkgx/bk/cmd/bk@main closure --build \
            --check-order seed/order.txt \
            --pantry "$RUNNER_TEMP/pantry" \
            --overlay "$RUNNER_TEMP/overlay" \
            --overrides overrides \
            $(grep -vE '^[[:space:]]*(#|$)' seed/order.txt | tr '\n' ' ')

      - name: test + 100% coverage gate
        run: |
          go test ./... -covermode=atomic -coverprofile=cov.out
          total=$(go tool cover -func=cov.out | awk '/^total:/{print $3}')
          echo "total coverage: $total"
          if [ "$total" != "100.0%" ]; then
            echo "coverage below 100%"; go tool cover -func=cov.out | awk '$3!="100.0%"'
            echo "== uncovered blocks =="; awk 'NR>1 && $NF==0' cov.out
            exit 1
          fi

  # Same reason as `test` above: this workflow triggers on pull_request, so a
  # fork's own copy of this file decides where its code runs. A cross-compile
  # matrix is cheap; the pool is not worth the exposure.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: linux, goarch: loong64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.2' }
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }} (CGO=0)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  # The rule above, enforced. A guard that lives only in a comment is a guard
  # that is gone the next time somebody wants the 32 cores back.
  no-self-hosted-on-fork-triggers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: no workflow may combine pull_request with a self-hosted runner
        run: |
          set -euo pipefail
          bad=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            # `pull_request` and `pull_request_target` both run fork-authored
            # code; the second is worse, since it gets repository secrets.
            grep -qE '^[[:space:]]*pull_request(_target)?:' "$f" || continue
            # Anchored on a real `runs-on:` key, not the substring: an
            # unanchored pattern matches this guard's own source and the check
            # fails on itself. Found by running it, not by reading it.
            grep -E '^[[:space:]]*runs-on:' "$f" | grep -q 'self-hosted' || continue
            echo "::error file=$f::$f triggers on pull_request AND runs on a self-hosted runner."
            echo "  For that event GitHub runs the workflow from the PR HEAD, so a fork"
            echo "  can name any label and execute on our machines. Use a hosted runner,"
            echo "  or move the job to a workflow_dispatch/schedule trigger."
            bad=1
          done
          [ "$bad" = 0 ] && echo "no workflow exposes a self-hosted runner to fork pull requests"
          exit "$bad"
