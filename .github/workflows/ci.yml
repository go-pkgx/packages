name: ci

# The Go in this repo is not a side-show: `catalog` IS the index-audit gate that
# runs at 04:00 and fails the day a published bottle drops out of its index,
# `browsergw` is the CORS front the browser package store talks through, and
# `openssl3` generates the override patches the factory applies. Until this lane
# existed, nothing compiled or tested any of it before merge — a change that
# broke `go run ./catalog` would have been discovered by the audit, in
# production, at four in the morning.

on:
  push: { branches: [main] }
  pull_request:

permissions: { contents: read }

jobs:
  # A workflow that triggers on `pull_request` must NOT run on a self-hosted
  # runner. For that event GitHub runs the workflow file from the PR's HEAD, so
  # a fork can add a job naming any label it likes and execute its code on our
  # machines. The label is not a boundary.
  #
  # This used to say [self-hosted, incus, amd64] — 32 cores, an ephemeral
  # container per job — and the speed was real. It is not worth the exposure:
  # `go vet`, gofmt and `go test` on this tree fit a hosted runner, and the
  # pool stays for build.yml, which is workflow_dispatch and schedule only.
  #
  # The default fork-PR policy on a public repository is "require approval for
  # first-time contributors", which does NOT close this: a contributor whose
  # first PR was merged then runs without approval. Moving off self-hosted
  # removes the intersection instead of gating it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # A project that upstream does not carry lives in two places — the override
      # patch the factory BUILDS from, and the overlay a consumer RESOLVES from.
      # Four such projects were published, signed, and unreachable to any
      # consumer because only the build half existed; nothing said so, because
      # the bottles were there and only a recipe fetch would have failed. This
      # reads the published overlay, not a checkout: a checkout can be right
      # while what is served is not.
      - name: both halves of a new project agree
        run: go run ./overlaycheck

      - name: test + 100% coverage gate
        run: |
          go test ./... -covermode=atomic -coverprofile=cov.out
          total=$(go tool cover -func=cov.out | awk '/^total:/{print $3}')
          echo "total coverage: $total"
          if [ "$total" != "100.0%" ]; then
            echo "coverage below 100%"; go tool cover -func=cov.out | awk '$3!="100.0%"'
            echo "== uncovered blocks =="; awk 'NR>1 && $NF==0' cov.out
            exit 1
          fi

  # Same reason as `test` above: this workflow triggers on pull_request, so a
  # fork's own copy of this file decides where its code runs. A cross-compile
  # matrix is cheap; the pool is not worth the exposure.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: linux, goarch: loong64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }} (CGO=0)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  # The rule above, enforced. A guard that lives only in a comment is a guard
  # that is gone the next time somebody wants the 32 cores back.
  no-self-hosted-on-fork-triggers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: no workflow may combine pull_request with a self-hosted runner
        run: |
          set -euo pipefail
          bad=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            # `pull_request` and `pull_request_target` both run fork-authored
            # code; the second is worse, since it gets repository secrets.
            grep -qE '^[[:space:]]*pull_request(_target)?:' "$f" || continue
            # Anchored on a real `runs-on:` key, not the substring: an
            # unanchored pattern matches this guard's own source and the check
            # fails on itself. Found by running it, not by reading it.
            grep -E '^[[:space:]]*runs-on:' "$f" | grep -q 'self-hosted' || continue
            echo "::error file=$f::$f triggers on pull_request AND runs on a self-hosted runner."
            echo "  For that event GitHub runs the workflow from the PR HEAD, so a fork"
            echo "  can name any label and execute on our machines. Use a hosted runner,"
            echo "  or move the job to a workflow_dispatch/schedule trigger."
            bad=1
          done
          [ "$bad" = 0 ] && echo "no workflow exposes a self-hosted runner to fork pull requests"
          exit "$bad"
