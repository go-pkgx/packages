name: build
on:
  workflow_dispatch:
    inputs:
      recipes:
        description: "space-separated projects to build (blank = the whole recipes.txt, chunked)"
        required: false
        default: ""
      max_versions:
        description: "cap versions per requested project, newest first (blank = all). Use 1 for a lean latest-only fill."
        required: false
        default: ""
      glibc:
        description: "build the whole closure against this exact glibc, e.g. 2.27.0 (blank = the container's). Publishes tools under <version>-glibc<ver>."
        required: false
        default: ""
      versions:
        description: "only consider versions matching this pkgx constraint, e.g. ^3 — the handle for an OLD line, which max_versions (newest-first) can never reach."
        required: false
        default: ""
      lock:
        description: "path to a `bk lock` file IN THIS REPOSITORY (e.g. locks/seed.lock.hcl). Builds exactly the versions it pins — every pin, not just its roots — and overrides `recipes`, the chunking and `versions`. A lock is the whole set: this is how a build is made to be the SAME build later, which plain re-dispatch is not. The same pantry commit 2df061bd resolved tcl to 9.0.4 and then to 9.1.0 four hours apart."
        required: false
        default: ""
      clean_build_root:
        description: "`1` removes the whole brewkit build root before starting. bk drops a tree once its bottle is published (go-pkgx/bk#217), but what a run INHERITS from earlier ones it cannot drop — and a seed on a small machine dies on that litter, reporting `no space left on device` against whichever project asked next. Destructive: a FAILED build's tree is kept on purpose, and this discards those too, so use it when the disk matters more than the last failure's evidence."
        required: false
        default: ""
      pin_to_dependents:
        description: "`1` holds each REQUESTED project to the constraints its dependents place on it, as a closure-only dependency already is. For a SEED, where every project is named and none would otherwise be held to anything: gnu.org/glibc asks for gnu.org/gcc 14, and a seed naming gcc built 16.2.0 — twenty-five minutes of compiling for a version nothing could use. Leave blank for a repair run: naming a project is how you say `this version, whatever else wants`."
        required: false
        default: ""
      no_closure:
        description: "build ONLY the projects named in recipes, not their dependency closure. For a REPAIR run: the dependencies are already published, and walking to them costs a version resolution each and can drag a toolchain in behind them."
        required: false
        default: ""
      runner:
        description: "where to run: blank = our GARM/Incus pool for BOTH arches (no GitHub minutes; aarch64 is emulated); `github` = both arches on GitHub's runners."
        required: false
        default: ""
      arch:
        description: "restrict the matrix to one arch: blank = x86-64 AND aarch64, or name one of `x86-64`, `aarch64`, `s390x`. A manual dispatch forces a rebuild by default (see `force`), so healing one arch's gaps without this reruns the others for nothing. s390x is OPT-IN — it is absent from the blank set until its toolchain is published, because adding an architecture with no bottles to every nightly buys a matrix of failures nobody reads."
        required: false
        default: ""
      force:
        description: "blank = a manual dispatch REBUILDS every project it names, even one already published, which is what healing a stale bottle needs. `0` skips the ones already in the dist, so a list can mean `build what is MISSING from this` — the question a bootstrap asks on every pass, and the only way to ask it today was to work out the answer beforehand by reading logs."
        required: false
        default: ""
      sovereign:
        description: "blank = build inside the FROM-scratch rootfs `bk builder` stages, so neither the host's libc nor its compiler takes part. `0` falls back to the runner's distribution. Ignored when mirror_from is set, which compiles nothing and would stage a toolchain for no reason."
        required: false
        default: ""
      source_mirror:
        description: "keep every source archive this run downloads in this registry, addressed by its sha256. Blank = keep nothing. 57% of the pantry builds from tarballs GitHub GENERATES on request rather than stores, so for those it is the first stored artefact they have ever had."
        required: false
        default: "oci://ghcr.io/go-pkgx"
      seed_dist:
        description: "read AND publish to this registry instead of ghcr, e.g. oci://127.0.0.1:5000/seed. For BOOTSTRAPPING an architecture nothing publishes: bottles made against a host distribution must not reach the real registry, so they go to a throwaway one on the runner and never leave it. Blank = ghcr, as always."
        required: false
        default: ""
      bootstrap:
        description: "`1` builds WITHOUT bk's base toolchain in the environment, taking those tools from the host. The base toolchain is a cycle with no entry point — every build is handed all fifteen of its members as bottles — so on an architecture with no bottles at all, nothing can be built first. Use it ONLY with seed_dist, and only for the first generation: rebuild everything inside the sovereign rootfs afterwards."
        required: false
        default: ""
      test_only:
        description: "`1` builds NOTHING: run each named project's own `test:` block against the version already in the registry, and record the outcome in tests.txt. The factory tests a bottle when it publishes it and never again, so this is the only way to notice one that STOPPED working — a dependency whose signature went bad takes every consumer down silently (go-pkgx/bk#250)."
        required: false
        default: ""
      mirror_from:
        description: "copy the bottles from this upstream dist instead of building them, e.g. https://dist.pkgx.dev — republished signed + attested (used for the glibc sweep)."
        required: false
        default: ""
  # Continuous population: rebuild recipes.txt daily. skip-if-published means
  # only new/updated (project,version,platform) are actually built.
  # schedule:  # cron disabled 2026-08-12 (free runners for targeted jobs; workflow_dispatch kept)
    # - cron: "0 6 * * *"

permissions:
  contents: read
  packages: write

env:
  CHUNK: "50"   # projects per matrix job (chunked so the full pantry fans out)

jobs:
  # Split recipes.txt into CHUNK-sized slices and emit a matrix over both linux
  # arches × every chunk, so the whole pantry is built best-effort in parallel.
  # A manual `recipes` input bypasses chunking (one job per arch with just those).
  setup:
    # The matrix generator has to run somewhere too: when GitHub's pool is the
    # thing that is unavailable, pinning this to ubuntu-latest queues the whole
    # workflow before it has decided anything.
    runs-on: ${{ github.event.inputs.runner == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted","incus","amd64"]') }}
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      # GitHub's images carry jq; our Incus runner image does not, and the
      # matrix generator is written in it. One apt line beats rewriting the
      # generator in shell.
      - name: jq
        run: command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq; }
      # Contradictory inputs, refused BEFORE a runner is taken. `bootstrap`
      # means "there is no base toolchain on this architecture yet, take the
      # tools from the host"; the sovereign rootfs is staged by RESOLVING that
      # same toolchain from a dist. Asking for both is asking for a toolchain
      # that does not exist, and what came back was
      #
      #   builder: resolve closure: GET https://dist.pkgx.dev/gnu.org/glibc/linux/s390x/versions.txt: Not Found
      #
      # ninety seconds into a job on the s390x runner — an error naming glibc,
      # which had done nothing wrong, for a contradiction stated in the inputs.
      # `sovereign` is not flipped silently: an input that quietly means
      # something else is worse than one that is refused.
      # Refused rather than reinterpreted, for the reason the note above
      # gives. --test-only compiles nothing, so it wants a staged toolchain as
      # little as mirroring does — and builder/sovereign-build.sh does not
      # pass the flag through, so that lane would quietly BUILD what the
      # operator asked only to test.
      #
      # Deciding the lane from this input instead would have meant testing it
      # here as `= 1` while bk reads it through envBool, which also accepts
      # `true`. Two readings of one value, disagreeing on exotic input, is
      # the silent divergence this repository keeps finding.
      - name: a test-only dispatch stages no toolchain
        env:
          TEST_ONLY: ${{ github.event.inputs.test_only }}
          SOVEREIGN: ${{ github.event.inputs.sovereign }}
        run: |
          [ -n "$TEST_ONLY" ] || exit 0
          [ "$SOVEREIGN" = 0 ] || {
            echo "::error::test_only=$TEST_ONLY builds nothing, so the sovereign rootfs would be staged for a run that compiles nothing — and sovereign-build.sh does not pass --test-only through, so it would BUILD instead. Pass sovereign=0 with it."
            exit 1
          }

      - name: a bootstrap dispatch states its two companions
        env:
          BOOTSTRAP: ${{ github.event.inputs.bootstrap }}
          SOVEREIGN: ${{ github.event.inputs.sovereign }}
          MAX_VERSIONS: ${{ github.event.inputs.max_versions }}
        run: |
          [ -n "$BOOTSTRAP" ] || exit 0
          [ "$SOVEREIGN" = 0 ] || {
            echo "::error::bootstrap=$BOOTSTRAP stages no toolchain, so the sovereign rootfs cannot be built from one. Pass sovereign=0 with it."
            exit 1
          }
          # `max_versions` blank means ALL versions, which is right for a
          # nightly and catastrophic for a seed: dispatched without it, a
          # 76-project bootstrap started down zlib.net's entire release
          # history — 1.2.5.2, 1.2.6, 1.2.7, … — on a host toolchain, and was
          # 191 builds in when it was cancelled. A seed makes an architecture
          # BUILDABLE; every historical version of every project is not that.
          [ -n "$MAX_VERSIONS" ] || {
            echo "::error::bootstrap=$BOOTSTRAP with max_versions blank means every version of every project. Pass max_versions=1 for a seed, or state a number."
            exit 1
          }
      - uses: actions/checkout@v7
      - id: gen
        run: |
          # Our own pool needs no `container:` — the Incus container IS the
          # controlled environment. It is debian TRIXIE (glibc 2.41), not
          # bookworm: the bottles bk installs to build with are MIRRORED from
          # upstream and linked against whatever distro built them, and our own
          # gnu.org/coreutils 9.11 needs GLIBC_2.38. On bookworm (2.36) every
          # build died at
          #     env: /lib/*/libc.so.6: version `GLIBC_2.38' not found
          # — measured by running that exact binary in both distributions. The
          # 2.36 floor this comment used to claim was never real for a pool
          # build; only the mirror path, which compiles nothing, ever worked
          # here. A floor lower than the container's is what `--glibc` is for.
          #
          # The host is amd64, so its aarch64 pool runs an aarch64 rootfs under
          # qemu-user (binfmt_misc, flag C so setuid still works). Measured
          # against the native pool: a short gcc run costs ~37x, a long-running
          # binary ~3x — the gap is qemu's per-process start-up, which configure
          # scripts pay thousands of times. Pass `runner: github` for the arm
          # runners GitHub bills for when a recipe is too slow to emulate.
          SELF='{"runner":["self-hosted","incus","amd64"],"platform":"linux/x86-64","slug":"linux-x86-64","container":""}'
          # Our aarch64 pool is EMULATED (the host is amd64). qemu_va is what
          # makes a build possible there at all: our gnu.org/bash carries bash's
          # own sbrk-based malloc and cannot allocate under qemu's default
          # reserved address space. jobs is a separate, milder judgement — 32
          # concurrent qemu processes on a shared pool is a poor trade — and NOT
          # the fix for the allocation failure; lowering it alone changed
          # nothing. Native runners keep both defaults.
          SELFARM='{"runner":["self-hosted","incus","arm64"],"platform":"linux/aarch64","slug":"linux-aarch64","container":"","jobs":"4","qemu_va":"0x400000000"}'
          GH64='{"runner":"ubuntu-latest","platform":"linux/x86-64","slug":"linux-x86-64","container":"debian:stable-slim"}'
          GHARM='{"runner":"ubuntu-24.04-arm","platform":"linux/aarch64","slug":"linux-aarch64","container":"debian:stable-slim"}'
          # IBM Z. A LinuxONE VM with a self-hosted runner built by
          # IBM/action-runner-image-pz — actions/runner does not build for
          # s390x out of the box (it is .NET, and linux-s390x is community
          # supported with no Microsoft binaries), which is why the label set
          # is ours rather than a GitHub-hosted one.
          #
          # container "" like SELF: the VM IS the environment. gaplib's images
          # are Ubuntu 22.04/24.04 or CentOS 9, and the `base tools` step below
          # uses apt-get, so an Ubuntu image is the assumption.
          #
          # This is the FIRST big-endian target. x86-64, aarch64 and both
          # darwin arches are little-endian, so every recipe with a byte-order
          # bug has been invisible until now. That is the point of the lane and
          # also where its cost will be — not in this matrix entry.
          # jobs "" — this lane asks the MACHINE. It is the one lane whose host
          # is a VM we resize, and "4" was written for it while the machine had
          # 2 cores. An empty value means the build step takes the cap the
          # census computed: min(nproc, min(MemTotal, cgroup)/2 GiB).
          SELFZ='{"runner":["self-hosted","linux","s390x"],"platform":"linux/s390x","slug":"linux-s390x","container":"","jobs":""}'
          X64=$SELF; ARM=$SELFARM
          if [ "${{ github.event.inputs.runner }}" = github ]; then X64=$GH64; ARM=$GHARM; fi
          # `arch` drops one half of the pair. jq gets it as a string and
          # filters on the slug, so an unknown value yields an empty matrix
          # rather than silently building everything.
          ONLY="${{ github.event.inputs.arch }}"
          if [ -n "${{ github.event.inputs.recipes }}" ]; then
            m=$(jq -cn --argjson a "$X64" --argjson b "$ARM" --argjson z "$SELFZ" --arg only "$ONLY" \
              '{include: [($a, $b, $z) + {chunk:"manual"}
                          | select(if $only == "" then (.slug | endswith("s390x") | not)
                                   else (.slug | endswith($only)) end)]}')
          else
            total=$(grep -vcE '^[[:space:]]*(#|$)' recipes.txt)
            n=$(( (total + CHUNK - 1) / CHUNK ))
            m=$(jq -cn --argjson n "$n" --argjson a "$X64" --argjson b "$ARM" --argjson z "$SELFZ" --arg only "$ONLY" \
              '{include: [range(0;$n) as $c | ($a, $b, $z) + {chunk:($c|tostring)}
                          | select(if $only == "" then (.slug | endswith("s390x") | not)
                                   else (.slug | endswith($only)) end)]}')
          fi
          [ "$(echo "$m" | jq '.include | length')" -gt 0 ] || { echo "arch=$ONLY matched no platform (expected blank, x86-64, aarch64 or s390x)" >&2; exit 1; }
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m" | jq '.include | length | "\(.) build jobs"'

  build:
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    # Phase A isolation: build inside a pinned, controlled debian base instead of
    # the drifting runner host — reproducible, no host-tool leakage, and a known
    # glibc floor. On our own Incus pool the container is EMPTY, because the
    # Incus container is already that environment and nesting one inside it would
    # need a docker daemon the runner image does not carry.
    container: ${{ matrix.container }}
    steps:
      - name: base tools
        run: |
          # In a container the job is root; on the self-hosted runner it is
          # `runner`, which is in the sudo group. Same step, either way.
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO apt-get update -qq
          $SUDO apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils build-essential gettext jq python3
          # some recipes' configure looks for `python`
          command -v python >/dev/null || $SUDO ln -sf "$(command -v python3)" /usr/local/bin/python

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with: { go-version: '1.27.2' }

      # OUR pkgx, not upstream's. Upstream resolves dependencies from its own
      # bundled pantry, so neither overrides/ nor PKGX_PANTRY_OVERLAY reaches it:
      # bk passes `+perl.org~5.42` (the pin texinfo's XS modules need) and
      # upstream intersects it with ITS idea of openssl's `perl.org: 5`, answering
      # "no intersection possible for perl.org" — with no way to correct the
      # recipe it was reading. Ours honours the overlay, resolves from our signed
      # registry, and is the runtime we actually ship.
      - name: install pkgx (bk sources its toolchain via `pkgx +deps`)
        run: |
          # CGO_ENABLED=0: this same binary is copied INTO the sovereign rootfs,
          # which has no system libc. Built against the runner's glibc it cannot
          # start there at all —
          #   /usr/local/bin/pkgx: error while loading shared libraries:
          #     libc.so.6: cannot open shared object file
          CGO_ENABLED=0 GOPROXY=direct go install github.com/go-pkgx/pkgx@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: install bk
        # GOPROXY=direct: pull the current main straight from GitHub, else the
        # module proxy serves a stale cached @main and CI runs an old bk.
        run: |
          # Static for the same reason as pkgx: bk is installed into the rootfs.
          CGO_ENABLED=0 GOPROXY=direct go install github.com/go-pkgx/bk/cmd/bk@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # --depth 1 of a moving branch, so WHICH pantry is a property of the
      # minute the run started and of nothing that is written down. Say it.
      - name: clone pantry
        run: |
          git clone --depth 1 https://github.com/pkgxdev/pantry
          echo "pantry $(git -C pantry rev-parse HEAD)"

      # The overlay is the half a CONSUMER resolves from, and it declares edges
      # upstream does not: perl.org NEEDs libcrypt.so.1, our overlay names the
      # provider, upstream's recipe says nothing. Until go-pkgx/bk#224 the
      # factory's closure walk read the pantry alone, so such a provider was
      # never built while every consumer asked the registry for it — and the
      # s390x seed only worked because its order had been computed by hand with
      # `bk closure --build --overlay` and pasted in.
      #
      # It does NOT change what is compiled: `bk factory` still builds the
      # pantry's recipe with the overrides applied. It widens the closure.
      - name: clone the pantry overlay
        run: |
          git clone --depth 1 https://github.com/go-pkgx/pantry-overlay overlay
          echo "overlay $(git -C overlay rev-parse HEAD)"

      # The sovereign path: a rootfs assembled from OUR bottles, entered with
      # chroot. The host then contributes three static Go binaries and a mount
      # namespace, and nothing it links against reaches the build. See
      # builder/README.md, and .github/workflows/sovereign.yml for the job that
      # proves one recipe end to end.
      # A zot pull-through cache runs on the pool host, bound to the Incus
      # bridge. Staging the toolchain pulls ~2 GiB (llvm.org alone is ~1.7), and
      # every job on this machine would otherwise pull it from ghcr again.
      # Detected rather than configured: a GitHub-hosted runner cannot reach
      # 10.46.81.1 and simply keeps ghcr. Signature verification is unaffected —
      # zot proxies the cosign referrer along with the bottle.
      # Unconditional: it only sets environment. A build that is NOT sovereign
      # still pulls its dependency bottles from our registry, and gating this on
      # the sovereign path would quietly take the cache away from it.
      # Decide ONCE whether this job is sovereign, in shell, and hand the answer
      # to every later step. Expressing one decision as two conditions is how
      # they drift: the step-level `if` and the shell branch disagreed, staging
      # was skipped while the build still chrooted, and the job died with
      #   chroot: failed to run command '/usr/local/bin/pkgx': No such file
      # (GitHub compares operands of different types as NUMBERS, so an omitted
      # input — null — equals the string '0'. The default case was the broken
      # one.) Shell has no such rule.
      - name: decide the build path
        env:
          SOVEREIGN: ${{ github.event.inputs.sovereign }}
          MIRROR_FROM: ${{ github.event.inputs.mirror_from }}
          SOURCE_MIRROR: ${{ github.event.inputs.source_mirror }}
        run: |
          if [ "$SOVEREIGN" = 0 ] || [ -n "$MIRROR_FROM" ]; then
            echo "building with the runner's distribution"
            echo "SOVEREIGN_ON=0" >> "$GITHUB_ENV"
          else
            echo "building inside the sovereign rootfs"
            echo "SOVEREIGN_ON=1" >> "$GITHUB_ENV"
          fi

      - name: point at the pull-through cache if it answers
        env:
          SEED_DIST: ${{ github.event.inputs.seed_dist }}
        run: |
          # The cache accelerates BLOB pulls only. It must not become PKGX_DIST:
          # zot cannot serve the tag listing of a repository it has not synced
          # yet, so resolution falls back to the upstream dist, takes a version
          # string from there, and asks the cache for a tag our registry does not
          # use — `gnu.org/bash` is published as `5.3`, not `5.3.0`:
          #   install gnu.org/bash 5.3.0: …/gnu.org/bash:5.3.0: not found
          # Listing stays on ghcr; PKGX_CACHE is consulted for the bottle itself.
          if [ -n "$SEED_DIST" ]; then
            # A bootstrap pass reads and writes ONE registry, and it is not
            # ghcr. No cache either: the cache fronts ghcr, and mixing the two
            # would let a real bottle answer a seed's question.
            echo "seeding into $SEED_DIST — ghcr is not consulted and not written"
            echo "PKGX_DIST=$SEED_DIST" >> "$GITHUB_ENV"
            # And no signature verification against it.
            #
            # Not a workaround: a throwaway registry on LOOPBACK, written and
            # read by the same job on the same machine, is not a trust
            # boundary. Anyone able to tamper with 127.0.0.1:5000 can tamper
            # with the rootfs directly, so verifying there protects against
            # nothing while refusing everything — the second generation died
            # staging its rootfs on
            #   install zlib.net 1.3.2: verify zlib.net v1.3.2 (linux/s390x):
            #   bottle: … is unsigned (no signature referrer)
            # after the toolchain had resolved (42 packages) and before a line
            # was compiled.
            #
            # ANSWERED, 2026-10-04, by the probe in `record what this run
            # read`: the registry returns HTTP 404 on
            # /v2/<repo>/referrers/<digest>. It does not serve the Referrers
            # API at all, so bk signs and has nowhere to put the signature.
            # Not a push that fails quietly, and not a bk defect.
            #
            # Which makes this setting the right one for a second reason, not
            # only the loopback argument: a registry that cannot HOLD a
            # signature cannot be verified against, whatever one wishes.
            #
            # Exactly scoped: this is the branch where ghcr is neither read nor
            # written, so nothing signed is being accepted unchecked.
            # …and the argument above is about LOOPBACK, so check for it.
            #
            # This read `if [ -n "$SEED_DIST" ]` and nothing else, so ANY
            # seed_dist turned signature verification off — including a
            # remote one, which is exactly the trust boundary the paragraph
            # above argues does not exist. The reasoning was right and the
            # condition did not implement it.
            #
            # Nothing has ever dispatched a non-loopback seed_dist; the input
            # has carried `oci://127.0.0.1:5000/seed` every time. That is the
            # kind of gap that stays harmless until someone reaches for the
            # obvious next thing — a seed registry shared between two
            # architectures, say — and silently loses verification doing it.
            #
            # Not an error: a remote seed registry is a reasonable thing to
            # want. It simply has to EARN the bottles it serves, like ghcr
            # does. If it cannot hold a signature it will say so at the first
            # install, which is a better failure than a silent one.
            # Host extraction, written out because two shapes break the
            # one-liner that suggests itself. `[` opens a glob, so stripping
            # it needs quoting; and `${h%%:*}` cuts at the FIRST colon, which
            # for `[::1]:5000` is inside the brackets and leaves `[`.
            seed_host=${SEED_DIST#*://}
            seed_host=${seed_host%%/*}
            case "$seed_host" in
              "["*) seed_host=${seed_host#"["}; seed_host=${seed_host%%"]"*} ;;
              *)    seed_host=${seed_host%%:*} ;;
            esac
            case "$seed_host" in
              127.*|localhost|::1)
                echo "verification off: a loopback throwaway registry is not a trust boundary"
                echo "PKGX_VERIFY=0" >> "$GITHUB_ENV"
                ;;
              *)
                echo "::notice::seed_dist host '$seed_host' is not loopback, so signature verification STAYS ON — the throwaway-registry argument does not reach it"
                ;;
            esac
            exit 0
          fi
          echo "PKGX_DIST=oci://ghcr.io/go-pkgx/packages" >> "$GITHUB_ENV"
          if curl -fsS -m 3 http://10.46.81.1:5111/v2/ >/dev/null 2>&1; then
            echo "pull-through cache answers — bottles will be pulled through it"
            echo "PKGX_CACHE=oci://http://10.46.81.1:5111/go-pkgx/packages" >> "$GITHUB_ENV"
          else
            echo "no cache on this runner — bottles come straight from ghcr"
          fi

      - name: stage the sovereign rootfs
        if: env.SOVEREIGN_ON == '1'
        env:
          PKGX_PANTRY_OVERLAY: https://raw.githubusercontent.com/go-pkgx/pantry-overlay/main/projects
        run: |
          CGO_ENABLED=0 GOPROXY=direct go install github.com/go-pkgx/pkgm@main
          # A SELF-HOSTED runner reuses $RUNNER_TEMP between jobs, and
          # bottle.InstallFor treats the mere EXISTENCE of <project>/v<ver> as
          # "already present":
          #
          #   if st, err := os.Stat(prefix); err == nil && st.IsDir() {
          #       return false, nil // already present
          #   }
          #
          # So a tree left half-written by a run that died mid-install is
          # indistinguishable from a complete one, and every later job
          # inherits it in silence. Measured on the s390x lane: four
          # successive pilots staged a gnu.org/glibc whose lib/glibc-2.44 held
          # TWO files — a real one has two hundred — because the first of them
          # died at `install zlib.net` and left that behind.
          #
          # The GitHub-hosted runners never showed it: their _temp is fresh.
          #
          # SUDO, because the tree is not ours to delete: the build runs under
          # `sudo unshare … chroot`, so everything it installed into the
          # rootfs's /pkgx belongs to root. A plain rm reported
          #   rm: cannot remove '…/rootfs/pkgx/lz4.org/v1.10.0/lib/liblz4.so':
          #   Permission denied
          # and `bash -e` ended the step before `bk builder` ran at all —
          # trading a silent stale tree for a loud refusal, which is better
          # but still not staging anything.
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO rm -rf "$RUNNER_TEMP/rootfs"
          # Resolve first, and do not stop at the first gap. Staging refuses
          # on the first root it cannot resolve, which is right for a build
          # and useless for bringing an architecture up: each run then names
          # one missing package and the next is only visible once that one is
          # built. --dry-run names EVERY blocked root in the same seconds, and
          # prints it immediately above the refusal that follows.
          #
          # `|| true`: this is diagnosis, not the gate. The staging below is
          # the verdict, and a pre-flight that could fail a job the real step
          # would have passed is a second opinion nobody asked for.
          bk builder --dry-run \
            --platform "${{ matrix.platform }}" \
            --toolchain builder/toolchain.txt || true
          bk builder \
            --out "$RUNNER_TEMP/rootfs" \
            --platform "${{ matrix.platform }}" \
            --toolchain builder/toolchain.txt \
            --bk "$(command -v bk)" \
            --pkgx "$(command -v pkgx)" \
            --container

      # What the machine HAS, in a step of its own.
      #
      # It was written inside the build step first, which is a number nobody
      # can read for the three hours that step runs — and the whole reason it
      # exists is that llvm.org died with
      #   c++: fatal error: Killed signal terminated program cc1plus
      # and the log held no figure at all. A measurement you cannot see until
      # the end is barely a measurement.
      #
      # It also computes the job cap, because a heavy LLVM translation unit
      # wants on the order of 2 GB in cc1plus and the s390x lane asked for four
      # at once without ever checking there were eight. Computed here rather
      # than written per machine: a number written down is what is wrong the
      # day the VM is resized.
      - name: what this machine has
        run: |
          echo "disk:   $(df -h "$HOME" | tail -1)"
          if [ -r /proc/meminfo ]; then
            memkb=$(awk '/^MemTotal:/{print $2}' /proc/meminfo)
            avail=$(awk '/^MemAvailable:/{print int($2/1024)}' /proc/meminfo)
            # SWAP, because without it the cap below is the whole budget and a
            # single translation unit can exceed it. llvm.org 23.1.2 was
            # OOM-killed on the s390x seed at object 3880 of 7967, after 1h43,
            # on RISCVInstructionSelector.cpp -- with the cap ALREADY applied
            # (4 asked for, 3 used, 8009 MiB total). The log said "run: exit
            # status 1" and the census said nothing about swap, so whether
            # there was any to exceed took a trawl through 6000 lines to learn.
            swapkb=$(awk '/^SwapTotal:/{print $2}' /proc/meminfo)
            echo "memory: $((memkb/1024)) MiB total, $avail MiB available, $((swapkb/1024)) MiB swap"
            # A CONTAINER sees the host's /proc/meminfo, not its own limit, so
            # the GARM lanes would compute a cap for a machine they do not
            # have. The cgroup limit is the honest number when there is one;
            # v2 writes "max" when there is none.
            lim=""
            for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory/memory.limit_in_bytes; do
              if [ -r "$f" ]; then v=$(cat "$f"); case "$v" in [0-9]*) lim=$((v/1024));; esac; break; fi
            done
            if [ -n "$lim" ] && [ "$lim" -gt 0 ] && [ "$lim" -lt "$memkb" ]; then
              echo "cgroup: $((lim/1024)) MiB limit, below the $((memkb/1024)) MiB this host has"
              memkb=$lim
            fi
            cap=$(( memkb / 2097152 ))   # one job per 2 GiB
            # And never more jobs than CORES. Measured 2026-09-28: the s390x VM
            # has nproc=2 and 8009 MiB, so the memory cap alone said 3 and the
            # run compiled THREE llvm translation units on TWO cores -- each
            # wanting upwards of 2 GiB of a machine that has 7.8. The cap was
            # above the core count, so it capped nothing that mattered, and
            # min(2,3)=2 would have halved the peak for no loss of speed: two
            # cores do not run three compilers faster.
            cpus=$(nproc 2>/dev/null || echo 1)
            if [ "$cpus" -lt "$cap" ]; then
              echo "cores:  $cpus, below the $cap that memory allows"
              cap=$cpus
            fi
            # An `if`, not `[ ... ] && cap=1`. The mechanism is not `set -e`,
            # which leaves an AND-list alone: it is the SCRIPT'S EXIT STATUS.
            # A bare `[ false ] && x` as the last command executed makes the
            # script exit 1 and the step fail, wherever the shell got to.
            #
            #   bash -e -c 'cap=3; [ $cap -lt 1 ] && cap=1; echo hi'   -> hi, 0
            #   bash -e -c 'cap=3; [ $cap -lt 1 ] && cap=1'            -> 1
            #
            # This one has echoes after it, so it is harmless TODAY. An `if` is
            # harmless wherever it is moved to, which is the difference worth
            # having in a file people append to.
            if [ "$cap" -lt 1 ]; then cap=1; fi
            echo "cpus:   $(nproc 2>/dev/null || echo '?')"
            echo "MEM_JOBS=$cap" >> "$GITHUB_ENV"
            echo "memory fits $cap concurrent compile job(s)"
            if [ "$swapkb" -eq 0 ]; then
              echo "::warning::no swap: a compile that needs more than $((memkb/1024/cap)) MiB is an OOM kill, not a slow build"
            fi
          fi

          # WHAT IS HOLDING THE DISK, here and not in the post-mortem step.
          #
          # `disk and memory after` carries always() and prints exactly this,
          # and on 2026-09-28 it did not run: llvm.org filled the filesystem
          # during `ninja install`, the runner died writing its OWN diagnostic
          # log — `No space left on device: .../Worker_….log` — and always()
          # cannot save a step from a process that is gone. The inventory of
          # what fills the disk was therefore printed only on the runs where
          # the disk did not fill.
          #
          # bk removes a build tree once its bottle is PUBLISHED, so what is
          # here is what FAILED, kept on purpose. That day it was 4.2 GiB of
          # rust-lang.org from two earlier runs, against 13 GiB for the llvm
          # tree being built and 19 GiB free when the run started.
          root="$HOME/.local/share/brewkit"
          if [ -d "$root" ]; then
            echo "build trees retained (bk keeps only what FAILED):"
            du -sm "$root"/*/*/ 2>/dev/null | sort -rn | head -10 |
              while read -r mb path; do printf '  %6s MiB  %s\n' "$mb" "${path#$root/}"; done
            biggest=$(du -sm "$root"/*/*/ 2>/dev/null | sort -rn | head -1 | cut -f1)
            freemb=$(df --output=avail -m "$HOME" | tail -1 | tr -d ' ')
            # Not an invented threshold: free space measured against the
            # largest tree already on disk. Below it, this machine cannot
            # afford to rebuild the biggest thing it has built.
            if [ -n "$biggest" ] && [ "$freemb" -lt "$biggest" ]; then
              echo "::warning::$freemb MiB free, and the largest retained build tree is $biggest MiB — this machine cannot afford another build that size"
            fi
          fi

      - name: build + publish this chunk
        env:
          PLATFORM: ${{ matrix.platform }}
          OCI_USERNAME: ${{ github.actor }}
          # The workflow's native token — no long-lived PAT; the go-pkgx/packages
          # packages are owned by this repo, so GITHUB_TOKEN writes natively.
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # bk resolves a project's versions from api.github.com, and sends
          # `Authorization: Bearer $GITHUB_TOKEN` when it has one. Without it
          # the calls are ANONYMOUS — 60 requests an hour against a workflow
          # that resolves one project after another — and the run fails partway
          # through on something that is not a build problem at all:
          #
          #   curl.se 8.20 (darwin/aarch64) — build failed: resolve version:
          #     releases https://api.github.com/repos/curl/curl/releases: 403
          #     rate limit exceeded
          #
          # Measured 2026-09-04: a six-project repair run lost two of them this
          # way. The token the job already holds for the registry raises the
          # ceiling to 5000/hour; it just was never handed to the build.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.BOTTLE_SIGNING_KEY }}
          GLIBC: ${{ github.event.inputs.glibc }}
          MIRROR_FROM: ${{ github.event.inputs.mirror_from }}
          SOURCE_MIRROR: ${{ github.event.inputs.source_mirror }}
          # The overlay is what bk's `--overrides` does for the recipes bk READS,
          # but for the recipes PKGX reads while materialising a build's
          # dependency environment. Without it, a dependency whose upstream recipe
          # still pins `openssl.org: ^1.1` stops the build with "no version of
          # openssl.org satisfies ^1.1" — which is exactly how
          # github.com/containers/crun died, through python.org, on a runner
          # where every other correction WAS applied.
          PKGX_PANTRY_OVERLAY: https://raw.githubusercontent.com/go-pkgx/pantry-overlay/main/projects
          VERSIONS: ${{ github.event.inputs.versions }}
          BOOTSTRAP: ${{ github.event.inputs.bootstrap }}
          # A VARIABLE bk reads through envBool, never
          # ${TEST_ONLY:+--test-only} on the command line below: `:+` tests
          # for non-empty and "0" is not empty, so that form turns the flag
          # ON when a dispatch said off. envBool exists because FORCE=0 had
          # to mean off (go-pkgx/bk#251), and this joins FORCE, NO_CLOSURE
          # and PIN_TO_DEPENDENTS in reading it that way.
          TEST_ONLY: ${{ github.event.inputs.test_only }}
          JOBS: ${{ matrix.jobs }}
          QEMU_RESERVED_VA: ${{ matrix.qemu_va }}
        run: |
          FORCE=""
          # A LOCK wins over every other way of naming the set, and is passed
          # to bk as a FILE rather than expanded here: bk reads it, and a
          # second expansion in shell would be a second answer to the same
          # question. See `bk factory --lock`.
          if [ -n "${{ github.event.inputs.lock }}" ]; then
            LOCK="${{ github.event.inputs.lock }}"
            [ -r "$LOCK" ] || { echo "::error::no lock at $LOCK in this repository"; exit 1; }
            echo "locked build from $LOCK ($(grep -c '= { version' "$LOCK") pin(s))"
          elif [ "${{ matrix.chunk }}" = "manual" ]; then
            RECIPES="${{ github.event.inputs.recipes }}"
            # A manual dispatch rebuilds what it names by default — that is what
            # refreshing a stale bottle is. `force: 0` turns the same list into
            # "build what is MISSING from this", which is the question a
            # bootstrap pass asks every time: a seed of 76 projects is grown a
            # few at a time and nothing on the outside knows which of them the
            # seed registry already holds. Without this the only way to ask was
            # to reconstruct the answer from the previous runs' logs, and a
            # count read off a log is a count of what the log happened to print.
            [ "${{ github.event.inputs.force }}" = "0" ] || FORCE=1
          else
            start=$(( ${{ matrix.chunk }} * CHUNK + 1 )); end=$(( start + CHUNK - 1 ))
            RECIPES="$(grep -vE '^[[:space:]]*(#|$)' recipes.txt | sed -n "${start},${end}p" | tr '\n' ' ')"
          fi
          # shellcheck disable=SC2086  # RECIPES is intentionally word-split to count projects
          echo "chunk ${{ matrix.chunk }} → $(printf '%s\n' $RECIPES | grep -c .) requested projects${FORCE:+ (FORCE rebuild)}"
          # RECIPES / FORCE / MAX_VERSIONS / PLATFORM / LOCK are read from the
          # env by `bk factory` itself; the rest is passed explicitly.
          # Disk, before and after, because a full one does not announce
          # itself — it arrives as somebody else's error. The s390x seed hit
          # it on the fifty-seventh project and reported
          #   kernel.org/linux-headers: fetch: write …: no space left on device
          # naming a project that had done nothing wrong. bk now removes a
          # published build tree (go-pkgx/bk#217); what a run INHERITS from
          # earlier ones it cannot remove, and only a number shows that.
          if [ -n "${{ github.event.inputs.clean_build_root }}" ]; then
            echo "clearing the build root a previous run left behind:"
            du -sh "$HOME/.local/share/brewkit" 2>/dev/null || true
            rm -rf "$HOME/.local/share/brewkit"
          fi
          echo "disk before:"; df -h "$HOME" | tail -1
          # The cap this run will use was computed and printed by the step
          # above, which finishes in a second so the number is readable while
          # this one runs for hours.
          if [ -z "$JOBS" ] && [ -n "$MEM_JOBS" ]; then
            # The lane asked the MACHINE. "Computed here rather than written
            # per machine: a number written down is what is wrong the day the
            # VM is resized" — the census step says that about the cap, and the
            # lane's own number was written down anyway. The s390x VM was
            # resized twice in one day: 4 was written for it, the machine had
            # 2 cores, and the replacement has 8.
            echo "jobs: none asked for, $MEM_JOBS fits this machine — using $MEM_JOBS"
            JOBS="$MEM_JOBS"
            export JOBS
          elif [ -n "$MEM_JOBS" ] && [ -n "$JOBS" ] && [ "$JOBS" -gt "$MEM_JOBS" ]; then
            echo "jobs: $JOBS asked for, $MEM_JOBS fits in memory — using $MEM_JOBS"
            JOBS="$MEM_JOBS"
            export JOBS
          fi
          du -sh "$HOME/.local/share/brewkit" 2>/dev/null || echo "  (no build root yet)"
          MAX_VERSIONS="${{ github.event.inputs.max_versions }}"
          NO_CLOSURE="${{ github.event.inputs.no_closure }}"
          PIN_TO_DEPENDENTS="${{ github.event.inputs.pin_to_dependents }}"
          export RECIPES FORCE MAX_VERSIONS NO_CLOSURE PIN_TO_DEPENDENTS LOCK
          # A glibc-pinned build links the pkgx glibc bottle directly, which bakes
          # an ABSOLUTE PT_INTERP pointing into $PKGX_DIR. Under the default
          # ($HOME/.pkgx) that is the RUNNER's home — a path no consumer has, so
          # the bottle could only start through an explicit loader invocation.
          # Build such bottles under the canonical /pkgx prefix instead: the same
          # one `pkgm image` bakes into a from-scratch image, so the interpreter
          # resolves where the package is actually installed.
          # (an `if`, not `[ … ] &&`. Not because of `set -e`, which leaves an
          # AND-list alone, but because a bare `[ false ] && x` as the LAST
          # command executed sets the script's exit status to 1 and fails the
          # step. An `if` is harmless wherever it is moved to.)
          if [ -n "$GLIBC" ]; then export PKGX_DIR=/pkgx; fi
          # Sovereign by default. The two arches are proven — lz4.org built in
          # the staged rootfs on x86-64 and on the EMULATED aarch64 pool, the
          # bottles carrying PT_INTERP into /pkgx and no distribution strings at
          # all — and the pull-through cache makes staging affordable. `0` is the
          # way back to the runner's distribution.
          #
          # Mirroring compiles nothing, so it never wants a toolchain staged.
          if [ "$SOVEREIGN_ON" = 1 ]; then
            # One shared script, not a copy: every line of it is there because
            # its absence was measured, and two divergent copies of that is how
            # one of them silently stops being sovereign.
            # A chunk is best-effort by design, so it must NOT fail on "0 built".
            export PKGX_DIR=/pkgx HOME=/root
            # A chunk is best-effort: the tally and the failure artifacts are
            # the result, and a recipe that genuinely does not build must not
            # paint the whole lot red. The proof job keeps the strict posture.
            export SOVEREIGN_STRICT=0
            SOVEREIGN_OVERLAY="$PWD/overlay" \
            builder/sovereign-build.sh \
              "$RUNNER_TEMP/rootfs" "$PWD/pantry" "$PWD/overrides" \
              ${GLIBC:+--glibc "$GLIBC"} \
              ${VERSIONS:+--versions "$VERSIONS"}
            # bk runs with the chroot's root as its CWD, so everything it
            # writes lands in the rootfs and not in the workspace the upload
            # steps read. Without this the failure lists are LOST: a lot that
            # fails a dozen recipes uploads no artifacts at all, and the only
            # remaining trace is the job log — which is exactly the evidence a
            # campaign needs to tell a broken recipe from a broken factory.
            cp -r "$RUNNER_TEMP/rootfs/dist" dist 2>/dev/null || true
            # tests.txt joins them: go-pkgx/bk#248 has the factory record
            # each published package's own test: block, and a record written
            # inside the rootfs is a record nobody reads.
            for f in failures.txt failures-detail.txt tests.txt; do
              cp "$RUNNER_TEMP/rootfs/$f" "$f" 2>/dev/null || true
            done
          else
            # --to follows PKGX_DIST rather than naming ghcr again: the two
            # must not be able to disagree, and a seed pass that READ a
            # throwaway registry while PUBLISHING to the real one is exactly
            # the accident this lane exists to make impossible.
            bk factory \
              --pantry pantry \
              --overrides overrides \
              --overlay overlay \
              --to "$PKGX_DIST" \
              --bottles dist \
              ${BOOTSTRAP:+--bootstrap} \
              ${GLIBC:+--glibc "$GLIBC"} \
              ${VERSIONS:+--versions "$VERSIONS"} \
              ${MIRROR_FROM:+--mirror-from "$MIRROR_FROM"} \
            ${SOURCE_MIRROR:+--source-mirror "$SOURCE_MIRROR"}
          fi

      # A NAMED dispatch that built nothing is a failed dispatch.
      #
      # A chunk of fifty is best-effort on purpose: one recipe that genuinely
      # does not build must not paint the whole lot red. That reasoning does
      # not reach a dispatch that names its recipes and produces no bottle at
      # all — there the green tick says the opposite of what happened.
      #
      # Measured on 2026-10-04: `recipes=kernel.org/linux-headers
      # versions==7.2.8` ended
      #   ❌ BUILD FAIL kernel.org/linux-headers 7.2.8: run: exit status 127
      #   === summary (linux/x86-64): 0 built, 0 skipped, 1 failed ===
      # and the job was GREEN. The next step was to merge a toolchain pin that
      # depended on that bottle existing.
      #
      # Deliberately narrow: 0 built AND something failed. A named dispatch
      # where some built and some failed keeps the best-effort posture, and
      # one that built nothing because there was nothing to build (force=0,
      # already published) has no failure and stays green.
      # NOT always(): if the build step itself failed the job is already red,
      # and a second error under it only competes with the first. Both the
      # sovereign path (SOVEREIGN_STRICT=0 for a chunk) and `bk factory`
      # exit 0 on a recipe failure, which is exactly the case this catches.
      - name: a named dispatch that built nothing
        if: github.event.inputs.recipes != ''
        run: |
          built=0
          [ -d dist ] && built=$(find dist -type f | wc -l | tr -d ' ')
          failed=0
          [ -s failures.txt ] && failed=$(grep -cvE '^[[:space:]]*$' failures.txt)
          echo "$built file(s) in dist, $failed failure(s)"
          if [ "$built" -eq 0 ] && [ "$failed" -gt 0 ]; then
            echo "::error::this dispatch named its recipes, published nothing and recorded $failed failure(s) — see failures-detail.txt"
            cat failures.txt
            exit 1
          fi

      # The CATALOGUE: what `pkgx ls` and <TAB> read.
      #
      # It exists because a registry cannot be enumerated. Measured against
      # ghcr: /v2/_catalog answers 403 to an anonymous client and only a
      # project's own tag list is served, so nothing can ask "what packages
      # are there" (go-pkgx/bottle#114). The answer is an artefact in the
      # registry, published as an ordinary bottle.
      #
      # ONE CHUNK, not every chunk. It is derived from the PANTRY, not from
      # what this job built, so all 38 chunks of a nightly would push the
      # same bytes. Chunk 0 and a named dispatch each publish it once.
      #
      # always(), because it describes what the pantry NAMES. A chunk that
      # failed to build anything has still read a complete pantry, and a
      # catalogue withheld on a red run is a catalogue that goes stale
      # exactly when someone is looking for why.
      #
      # It follows PKGX_DIST like everything else here, so a seed run writes
      # its catalogue into the seed registry and not into the real one.
      #
      # --overrides, because an override changes a recipe's DEPENDENCIES and
      # the catalogue now carries them. Without it the published tree
      # describes a factory that is not this one: the reader would be shown
      # the upstream recipe's edges while every bottle beside them was built
      # from the corrected ones.
      #
      # --versions, which is ~1900 requests. That is the price of being able
      # to say "this exists but has no bottle for your platform" instead of
      # listing a name with nothing beside it, and it is paid HERE — once, in
      # CI, on one chunk — rather than on the machine of everyone who presses
      # <TAB>. It is also why the catalogue is per-platform: the s390x lane
      # has a fraction of what linux/x86-64 has, and one list would tell most
      # readers that packages are available which, for them, are not.
      #
      # SIGNING_KEY, because a client with PKGX_VERIFY on — the default —
      # refuses an unsigned catalogue (go-pkgx/bottle#118). The catalogue is
      # the list of names a person then TYPES, so whoever decides its
      # contents decides what <TAB> offers; it gets the same signature as any
      # other bottle. A seed run has no key and says so in its own output.
      - name: publish the catalogue
        if: always() && (matrix.chunk == '0' || matrix.chunk == 'manual')
        env:
          PLATFORM: ${{ matrix.platform }}
          OCI_USERNAME: ${{ github.actor }}
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.BOTTLE_SIGNING_KEY }}
        run: |
          set -eu
          bk catalog \
            --pantry pantry \
            --overlay overlay \
            --overrides overrides \
            --versions \
            --platform "$PLATFORM" \
            --publish

      # AFTER, and `always()`, because the number matters most on the run
      # that just failed. A step that only reports on success reports the
      # disk of every run except the one that filled it.
      - name: disk and memory after
        if: always()
        run: |
          df -h "$HOME" | tail -1
          # Memory too, and `always()` matters more here than for disk: a run
          # the OOM killer ended reports nothing about memory unless the step
          # runs on failure. llvm.org died at 4297 of 7967 objects with
          # "Killed signal terminated program cc1plus" and took the runner with
          # it, and the log held no number at all.
          # An `if`, not `[ … ] &&`. The note this replaces blamed `set -e`,
          # which is wrong and sent me looking for a landmine that was not
          # there: `set -e` leaves an AND-list alone. What bites is the
          # SCRIPT'S EXIT STATUS — a bare `[ false ] && x` as the LAST command
          # executed makes the step fail. An `if` is harmless wherever it lands.
          if [ -r /proc/meminfo ]; then
            awk '/^Mem(Total|Available):/{printf "%s %d MiB\n", $1, $2/1024}' /proc/meminfo
          fi
          du -sh "$HOME/.local/share/brewkit" 2>/dev/null || echo "  (no build root)"
          # The ten biggest directories left behind, at ANY depth. bk
          # removes a tree once its bottle is PUBLISHED (go-pkgx/bk#217),
          # so what remains is what FAILED — kept on purpose, and worth
          # seeing the size of.
          #
          # No glob: a project name carries a variable number of slashes
          # (zlib.net against x.org/protocol/xcb), so a fixed `*/*/*`
          # would compare a project directory against a version one.
          du -h "$HOME/.local/share/brewkit" 2>/dev/null | sort -rh | head -10 || true

      # What a SEED generation was made of.
      #
      # Nix keeps its bootstrap-tools as a committed, versioned artefact, so
      # anyone can say what the first generation on a platform was built from.
      # Ours is deliberately ephemeral — it lives in a throwaway loopback
      # registry and is thrown away once the sovereign rebuild replaces it —
      # which is defensible, and leaves the second generation unable to name
      # its parent.
      #
      # So record the parent instead of keeping it: the host tools that stood
      # in for bottles, and the state of the seed registry when the run ended.
      # Without this the only trace of WHICH gcc compiled the first s390x
      # toolchain is a runner that will be reimaged.
      # EVERY run, not only a bootstrap. The gate was `bootstrap == '1'`
      # because the host-tool census was written for a seed generation — and
      # it took the "== the inputs that were not pinned ==" block with it,
      # which is the part that is about ANY run.
      #
      # Found by needing it: a --test-only sweep chased the same question
      # twice — which bk did this run install? — and the only trace was the
      # module cache's tar warnings, which name whatever versions are on
      # disk rather than the one that ran.
      #
      # The census stays for every run too. `command -v` twenty times and a
      # catalogue listing cost nothing next to a build, and a run that used
      # the host's gcc is worth recording whether or not it was the first.
      - name: record what this run read
        if: always()
        env:
          SEED_DIST: ${{ github.event.inputs.seed_dist }}
        run: |
          : > seed-provenance.txt
          {
            # The file keeps its name. It is written for every run now, not
            # only a seed's, and renaming it would break whatever anybody has
            # pointed at `seed-provenance-*` — so the correction goes in the
            # first line, where a reader meets it.
            echo "run provenance (any run; the name is historical) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "platform:  ${PLATFORM:-?}"
            echo "runner:    $(uname -srm)"
            echo "distro:    $(. /etc/os-release 2>/dev/null && echo "$PRETTY_NAME" || echo unknown)"
            echo
            # The commit above this file is only ONE of the run's inputs. The
            # pantry and the overlay are cloned --depth 1 from a moving branch
            # and bk is installed @main, so three of the four inputs to a build
            # were, until this block, decided at run time and written nowhere.
            #
            # On 2026-09-29 two runs an hour apart at the SAME packages commit
            # disagreed about whether an override applied. Answering "did the
            # pantry move?" meant querying GitHub's API afterwards — which
            # worked only because the history was short and public, and would
            # not have worked at all a month later. A run has to be able to say
            # what it read.
            #
            # An input that cannot be read is recorded as unread, never as
            # absent: "(unread)" is a different claim from a repository that
            # was not cloned, and a reader must not have to guess which.
            echo "== the inputs that were not pinned =="
            printf '%-10s %s\n' packages "${GITHUB_SHA:-(unread)}"
            for d in pantry overlay; do
              if [ -d "$d/.git" ]; then
                printf '%-10s %s\n' "$d" "$(git -C "$d" rev-parse HEAD 2>/dev/null || echo '(unread)')"
              else
                printf '%-10s %s\n' "$d" "(not cloned)"
              fi
            done
            # go version -m reads the module version STAMPED INTO the binary,
            # which is the one thing here that cannot drift from what ran.
            #
            # Taken through a variable rather than inlined in the printf: a
            # binary that is there but carries no stamp makes the pipeline
            # print NOTHING and succeed, and an empty field beside a label
            # reads as an answer. Ask whether it is empty, and say so.
            bkver=""
            bkbin=$(command -v bk 2>/dev/null || true)
            if [ -n "$bkbin" ]; then
              bkver=$(go version -m "$bkbin" 2>/dev/null |
                awk '$1=="mod" && $2=="github.com/go-pkgx/bk" {print $3}')
            fi
            printf '%-10s %s\n' bk "${bkver:-(unread)}"
            echo
            echo "== host tools that stood in for bottles =="
            # Each of these can be what --bootstrap fell back to. Recording the
            # whole set rather than the ones this chunk happened to use: the
            # seed is one generation, not one chunk.
            for t in gcc g++ cc ld ar make m4 perl curl awk sed grep bison flex pkg-config autoconf automake libtool python3; do
              p=$(command -v "$t" 2>/dev/null) || { printf '%-12s absent\n' "$t"; continue; }
              v=$("$t" --version 2>/dev/null | head -1)
              printf '%-12s %s  %s\n' "$t" "$p" "${v:-(no --version)}"
            done
            echo
            # Repositories AND the versions in them.
            #
            # The catalog alone answers "is x.org/x11 in the seed", and the
            # question that actually comes up is "which x11". tcl-lang.org
            # declares `x.org/x11: =1.8.11` as a LINK dependency, the seed has
            # 1.8.13, and a listing of repository names cannot tell you that —
            # I read this file looking for exactly that and it was not here.
            #
            # A registry with no tags for a repository still prints the
            # repository, because "present with no version" is a state worth
            # seeing rather than a row to drop.
            echo "== seed registry contents =="
            if [ -n "$SEED_DIST" ]; then
              base=${SEED_DIST#oci://}
              host=${base%%/*}
              if repos=$(curl -fsS -m 20 "http://$host/v2/_catalog" 2>/dev/null); then
                echo "$repos" | tr ',' '\n' | sed -n 's/.*"\([^"]*\)".*/\1/p' | grep -vx repositories | sort -u |
                while read -r r; do
                  [ -n "$r" ] || continue
                  tags=$(curl -fsS -m 20 "http://$host/v2/$r/tags/list" 2>/dev/null |
                         tr ',' '\n' | sed -n 's/.*"\([0-9][^"]*\)".*/\1/p' |
                         grep -v -- '--' | sort -Vu | tr '\n' ' ')
                  printf '%-44s %s\n' "$r" "${tags:-(no version tag)}"
                done
              else
                echo "(catalog unreadable)"
              fi
              # Does this registry hold SIGNATURES at all?
              #
              # The second generation died staging its rootfs on "zlib.net
              # v1.3.2 (linux/s390x) is unsigned (no signature referrer)",
              # and the seed run HAS $SIGNING_KEY — bk signs whenever it is
              # set. So either the registry cannot store a referrer or the
              # push fails quietly, and nothing on the runner said which.
              #
              # One probe, on one real bottle, so the next run answers it for
              # free instead of leaving a note that says "unknown". A 404 or
              # an empty manifest list is the registry saying it does not
              # serve the Referrers API; an index with entries means the
              # signature IS there and the verifier is looking elsewhere.
              echo "-- referrers API --"
              probe=$(echo "$repos" | tr ',' '\n' | sed -n 's/.*"\([^"]*\)".*/\1/p' |
                      grep -vx repositories | sort -u | head -1)
              if [ -n "$probe" ]; then
                tag=$(curl -fsS -m 20 "http://$host/v2/$probe/tags/list" 2>/dev/null |
                      tr ',' '\n' | sed -n 's/.*"\([0-9][^"]*\)".*/\1/p' |
                      grep -v -- '--' | sort -Vu | tail -1)
                dig=$(curl -fsS -m 20 -o /dev/null -D- \
                        -H 'Accept: application/vnd.oci.image.index.v1+json' \
                        -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
                        "http://$host/v2/$probe/manifests/$tag" 2>/dev/null |
                      tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: *//p')
                if [ -n "$dig" ]; then
                  # NO -f: this probe WANTS the status, and -f makes curl
                  # exit non-zero on a 404 — so `%{http_code}` and the `|| echo
                  # 000` fallback both wrote and the first run reported
                  # "HTTP 404000". Readable by luck, because 404 is
                  # unmistakable; a 200 would have come out "200000".
                  code=$(curl -sS -m 20 -o /tmp/ref.json -w '%{http_code}' \
                           "http://$host/v2/$probe/referrers/$dig" 2>/dev/null || echo 000)
                  n=$(tr ',' '\n' < /tmp/ref.json 2>/dev/null | grep -c artifactType || true)
                  echo "$probe@$tag -> HTTP $code, $n referrer(s)"
                else
                  echo "$probe: no content digest for tag ${tag:-(none)}"
                fi
              else
                echo "(no repository to probe)"
              fi
            else
              echo "(no seed_dist)"
            fi
            echo
          } >> seed-provenance.txt
          cat seed-provenance.txt

      - name: upload seed provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seed-provenance-${{ matrix.slug }}-${{ matrix.chunk }}
          path: seed-provenance.txt
          if-no-files-found: ignore

      # The pkgx dist tree `bk factory --bottles dist` writes — unioned into
      # the GitHub Pages mirror by pages.yml. Named per arch+chunk so pages.yml
      # discovers every slice (it globs dist-*).
      - name: upload dist tree
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.slug }}-${{ matrix.chunk }}
          path: dist
          if-no-files-found: ignore

      - name: upload failures list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failures-${{ matrix.slug }}-${{ matrix.chunk }}
          path: failures.txt
          if-no-files-found: ignore

      # Per-recipe error tails, so build failures are diagnosable from the
      # artifact alone (container-job logs are not retrievable via the API).
      - name: upload failure details
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failures-detail-${{ matrix.slug }}-${{ matrix.chunk }}
          path: failures-detail.txt
          if-no-files-found: ignore

      # What each published package's OWN test: block said — four states, one
      # line each (go-pkgx/bk#248). Separate from failures.txt on purpose: a
      # failing test is not a failing build, and the factory's exit status is
      # untouched by it. Of 12 test failures measured over 120 packages only 2
      # were a bottle nobody can run, which is why this is a record and not a
      # gate.
      - name: upload the test record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.slug }}-${{ matrix.chunk }}
          path: tests.txt
          if-no-files-found: ignore
