name: build
on:
  workflow_dispatch:
    inputs:
      recipes:
        description: "space-separated projects to build (blank = the whole recipes.txt, chunked)"
        required: false
        default: ""
      max_versions:
        description: "cap versions per requested project, newest first (blank = all). Use 1 for a lean latest-only fill."
        required: false
        default: ""
      glibc:
        description: "build the whole closure against this exact glibc, e.g. 2.27.0 (blank = the container's). Publishes tools under <version>-glibc<ver>."
        required: false
        default: ""
      versions:
        description: "only consider versions matching this pkgx constraint, e.g. ^3 — the handle for an OLD line, which max_versions (newest-first) can never reach."
        required: false
        default: ""
      no_closure:
        description: "build ONLY the projects named in recipes, not their dependency closure. For a REPAIR run: the dependencies are already published, and walking to them costs a version resolution each and can drag a toolchain in behind them."
        required: false
        default: ""
      runner:
        description: "where to run: blank = our GARM/Incus pool for BOTH arches (no GitHub minutes; aarch64 is emulated); `github` = both arches on GitHub's runners."
        required: false
        default: ""
      arch:
        description: "restrict the matrix to one arch: blank = both, `x86-64`, `aarch64`. A manual dispatch forces a rebuild, so healing one arch's gaps without this reruns the other arch for nothing."
        required: false
        default: ""
      sovereign:
        description: "build inside the FROM-scratch rootfs `bk builder` stages, so neither the host's libc nor its compiler takes part (blank = the runner's distribution, which is what decides today). Not compatible with mirror_from, which compiles nothing."
        required: false
        default: ""
      mirror_from:
        description: "copy the bottles from this upstream dist instead of building them, e.g. https://dist.pkgx.dev — republished signed + attested (used for the glibc sweep)."
        required: false
        default: ""
  # Continuous population: rebuild recipes.txt daily. skip-if-published means
  # only new/updated (project,version,platform) are actually built.
  # schedule:  # cron disabled 2026-08-12 (free runners for targeted jobs; workflow_dispatch kept)
    # - cron: "0 6 * * *"

permissions:
  contents: read
  packages: write

env:
  CHUNK: "50"   # projects per matrix job (chunked so the full pantry fans out)

jobs:
  # Split recipes.txt into CHUNK-sized slices and emit a matrix over both linux
  # arches × every chunk, so the whole pantry is built best-effort in parallel.
  # A manual `recipes` input bypasses chunking (one job per arch with just those).
  setup:
    # The matrix generator has to run somewhere too: when GitHub's pool is the
    # thing that is unavailable, pinning this to ubuntu-latest queues the whole
    # workflow before it has decided anything.
    runs-on: ${{ github.event.inputs.runner == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted","incus","amd64"]') }}
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      # GitHub's images carry jq; our Incus runner image does not, and the
      # matrix generator is written in it. One apt line beats rewriting the
      # generator in shell.
      - name: jq
        run: command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq; }
      - uses: actions/checkout@v4
      - id: gen
        run: |
          # Our own pool needs no `container:` — the Incus container IS the
          # controlled environment. It is debian TRIXIE (glibc 2.41), not
          # bookworm: the bottles bk installs to build with are MIRRORED from
          # upstream and linked against whatever distro built them, and our own
          # gnu.org/coreutils 9.11 needs GLIBC_2.38. On bookworm (2.36) every
          # build died at
          #     env: /lib/*/libc.so.6: version `GLIBC_2.38' not found
          # — measured by running that exact binary in both distributions. The
          # 2.36 floor this comment used to claim was never real for a pool
          # build; only the mirror path, which compiles nothing, ever worked
          # here. A floor lower than the container's is what `--glibc` is for.
          #
          # The host is amd64, so its aarch64 pool runs an aarch64 rootfs under
          # qemu-user (binfmt_misc, flag C so setuid still works). Measured
          # against the native pool: a short gcc run costs ~37x, a long-running
          # binary ~3x — the gap is qemu's per-process start-up, which configure
          # scripts pay thousands of times. Pass `runner: github` for the arm
          # runners GitHub bills for when a recipe is too slow to emulate.
          SELF='{"runner":["self-hosted","incus","amd64"],"platform":"linux/x86-64","slug":"linux-x86-64","container":""}'
          # jobs: our aarch64 pool is EMULATED (the host is amd64), and one make
          # job per CPU makes bash fail to allocate under qemu-user. Native
          # runners keep the default.
          SELFARM='{"runner":["self-hosted","incus","arm64"],"platform":"linux/aarch64","slug":"linux-aarch64","container":"","jobs":"4"}'
          GH64='{"runner":"ubuntu-latest","platform":"linux/x86-64","slug":"linux-x86-64","container":"debian:stable-slim"}'
          GHARM='{"runner":"ubuntu-24.04-arm","platform":"linux/aarch64","slug":"linux-aarch64","container":"debian:stable-slim"}'
          X64=$SELF; ARM=$SELFARM
          if [ "${{ github.event.inputs.runner }}" = github ]; then X64=$GH64; ARM=$GHARM; fi
          # `arch` drops one half of the pair. jq gets it as a string and
          # filters on the slug, so an unknown value yields an empty matrix
          # rather than silently building everything.
          ONLY="${{ github.event.inputs.arch }}"
          if [ -n "${{ github.event.inputs.recipes }}" ]; then
            m=$(jq -cn --argjson a "$X64" --argjson b "$ARM" --arg only "$ONLY" \
              '{include: [($a, $b) + {chunk:"manual"} | select($only == "" or (.slug | endswith($only)))]}')
          else
            total=$(grep -vcE '^[[:space:]]*(#|$)' recipes.txt)
            n=$(( (total + CHUNK - 1) / CHUNK ))
            m=$(jq -cn --argjson n "$n" --argjson a "$X64" --argjson b "$ARM" --arg only "$ONLY" \
              '{include: [range(0;$n) as $c | ($a, $b) + {chunk:($c|tostring)} | select($only == "" or (.slug | endswith($only)))]}')
          fi
          [ "$(echo "$m" | jq '.include | length')" -gt 0 ] || { echo "arch=$ONLY matched no platform (expected blank, x86-64 or aarch64)" >&2; exit 1; }
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m" | jq '.include | length | "\(.) build jobs"'

  build:
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    # Phase A isolation: build inside a pinned, controlled debian base instead of
    # the drifting runner host — reproducible, no host-tool leakage, and a known
    # glibc floor. On our own Incus pool the container is EMPTY, because the
    # Incus container is already that environment and nesting one inside it would
    # need a docker daemon the runner image does not carry.
    container: ${{ matrix.container }}
    steps:
      - name: base tools
        run: |
          # In a container the job is root; on the self-hosted runner it is
          # `runner`, which is in the sudo group. Same step, either way.
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO apt-get update -qq
          $SUDO apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils build-essential gettext jq python3
          # some recipes' configure looks for `python`
          command -v python >/dev/null || $SUDO ln -sf "$(command -v python3)" /usr/local/bin/python

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: stable }

      # OUR pkgx, not upstream's. Upstream resolves dependencies from its own
      # bundled pantry, so neither overrides/ nor PKGX_PANTRY_OVERLAY reaches it:
      # bk passes `+perl.org~5.42` (the pin texinfo's XS modules need) and
      # upstream intersects it with ITS idea of openssl's `perl.org: 5`, answering
      # "no intersection possible for perl.org" — with no way to correct the
      # recipe it was reading. Ours honours the overlay, resolves from our signed
      # registry, and is the runtime we actually ship.
      - name: install pkgx (bk sources its toolchain via `pkgx +deps`)
        run: |
          GOPROXY=direct go install github.com/go-pkgx/pkgx@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: install bk
        # GOPROXY=direct: pull the current main straight from GitHub, else the
        # module proxy serves a stale cached @main and CI runs an old bk.
        run: |
          GOPROXY=direct go install github.com/go-pkgx/bk/cmd/bk@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: clone pantry
        run: git clone --depth 1 https://github.com/pkgxdev/pantry

      # The sovereign path: a rootfs assembled from OUR bottles, entered with
      # chroot. The host then contributes three static Go binaries and a mount
      # namespace, and nothing it links against reaches the build. See
      # builder/README.md, and .github/workflows/sovereign.yml for the job that
      # proves one recipe end to end.
      # A zot pull-through cache runs on the pool host, bound to the Incus
      # bridge. Staging the toolchain pulls ~2 GiB (llvm.org alone is ~1.7), and
      # every job on this machine would otherwise pull it from ghcr again.
      # Detected rather than configured: a GitHub-hosted runner cannot reach
      # 10.46.81.1 and simply keeps ghcr. Signature verification is unaffected —
      # zot proxies the cosign referrer along with the bottle.
      - name: point at the pull-through cache if it answers
        if: github.event.inputs.sovereign != ''
        run: |
          # The cache accelerates BLOB pulls only. It must not become PKGX_DIST:
          # zot cannot serve the tag listing of a repository it has not synced
          # yet, so resolution falls back to the upstream dist, takes a version
          # string from there, and asks the cache for a tag our registry does not
          # use — `gnu.org/bash` is published as `5.3`, not `5.3.0`:
          #   install gnu.org/bash 5.3.0: …/gnu.org/bash:5.3.0: not found
          # Listing stays on ghcr; PKGX_CACHE is consulted for the bottle itself.
          echo "PKGX_DIST=oci://ghcr.io/go-pkgx/packages" >> "$GITHUB_ENV"
          if curl -fsS -m 3 http://10.46.81.1:5111/v2/ >/dev/null 2>&1; then
            echo "pull-through cache answers — bottles will be pulled through it"
            echo "PKGX_CACHE=oci://http://10.46.81.1:5111/go-pkgx/packages" >> "$GITHUB_ENV"
          else
            echo "no cache on this runner — bottles come straight from ghcr"
          fi

      - name: stage the sovereign rootfs
        if: github.event.inputs.sovereign != ''
        env:
          PKGX_PANTRY_OVERLAY: https://raw.githubusercontent.com/go-pkgx/pantry-overlay/main/projects
        run: |
          CGO_ENABLED=0 GOPROXY=direct go install github.com/go-pkgx/pkgm@main
          bk builder \
            --out "$RUNNER_TEMP/rootfs" \
            --platform "${{ matrix.platform }}" \
            --toolchain builder/toolchain.txt \
            --bk "$(command -v bk)" \
            --pkgx "$(command -v pkgx)" \
            --container

      - name: build + publish this chunk
        env:
          PLATFORM: ${{ matrix.platform }}
          OCI_USERNAME: ${{ github.actor }}
          # The workflow's native token — no long-lived PAT; the go-pkgx/packages
          # packages are owned by this repo, so GITHUB_TOKEN writes natively.
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.BOTTLE_SIGNING_KEY }}
          GLIBC: ${{ github.event.inputs.glibc }}
          MIRROR_FROM: ${{ github.event.inputs.mirror_from }}
          # The overlay is what bk's `--overrides` does for the recipes bk READS,
          # but for the recipes PKGX reads while materialising a build's
          # dependency environment. Without it, a dependency whose upstream recipe
          # still pins `openssl.org: ^1.1` stops the build with "no version of
          # openssl.org satisfies ^1.1" — which is exactly how
          # github.com/containers/crun died, through python.org, on a runner
          # where every other correction WAS applied.
          PKGX_PANTRY_OVERLAY: https://raw.githubusercontent.com/go-pkgx/pantry-overlay/main/projects
          VERSIONS: ${{ github.event.inputs.versions }}
          SOVEREIGN: ${{ github.event.inputs.sovereign }}
          JOBS: ${{ matrix.jobs }}
        run: |
          FORCE=""
          if [ "${{ matrix.chunk }}" = "manual" ]; then
            RECIPES="${{ github.event.inputs.recipes }}"
            FORCE=1   # explicit manual dispatch always rebuilds (bypass skip-if-published → refresh stale bottles)
          else
            start=$(( ${{ matrix.chunk }} * CHUNK + 1 )); end=$(( start + CHUNK - 1 ))
            RECIPES="$(grep -vE '^[[:space:]]*(#|$)' recipes.txt | sed -n "${start},${end}p" | tr '\n' ' ')"
          fi
          # shellcheck disable=SC2086  # RECIPES is intentionally word-split to count projects
          echo "chunk ${{ matrix.chunk }} → $(printf '%s\n' $RECIPES | grep -c .) requested projects${FORCE:+ (FORCE rebuild)}"
          # RECIPES / FORCE / MAX_VERSIONS / PLATFORM are read from the env by
          # `bk factory` itself; the rest is passed explicitly.
          MAX_VERSIONS="${{ github.event.inputs.max_versions }}"
          NO_CLOSURE="${{ github.event.inputs.no_closure }}"
          export RECIPES FORCE MAX_VERSIONS NO_CLOSURE
          # A glibc-pinned build links the pkgx glibc bottle directly, which bakes
          # an ABSOLUTE PT_INTERP pointing into $PKGX_DIR. Under the default
          # ($HOME/.pkgx) that is the RUNNER's home — a path no consumer has, so
          # the bottle could only start through an explicit loader invocation.
          # Build such bottles under the canonical /pkgx prefix instead: the same
          # one `pkgm image` bakes into a from-scratch image, so the interpreter
          # resolves where the package is actually installed.
          # (an `if`, not `[ … ] &&`: the runner wraps this in `bash -e {0}`, so a
          # false test as a bare statement would abort the whole step)
          if [ -n "$GLIBC" ]; then export PKGX_DIR=/pkgx; fi
          if [ -n "$SOVEREIGN" ]; then
            # One shared script, not a copy: every line of it is there because
            # its absence was measured, and two divergent copies of that is how
            # one of them silently stops being sovereign.
            # A chunk is best-effort by design, so it must NOT fail on "0 built".
            export PKGX_DIR=/pkgx HOME=/root
            export SOVEREIGN_REQUIRE_BUILD=0
            builder/sovereign-build.sh \
              "$RUNNER_TEMP/rootfs" "$PWD/pantry" "$PWD/overrides" \
              ${GLIBC:+--glibc "$GLIBC"} \
              ${VERSIONS:+--versions "$VERSIONS"}
            cp -r "$RUNNER_TEMP/rootfs/dist" dist 2>/dev/null || true
          else
            bk factory \
              --pantry pantry \
              --overrides overrides \
              --to oci://ghcr.io/go-pkgx/packages \
              --bottles dist \
              ${GLIBC:+--glibc "$GLIBC"} \
              ${VERSIONS:+--versions "$VERSIONS"} \
              ${MIRROR_FROM:+--mirror-from "$MIRROR_FROM"}
          fi

      # The pkgx dist tree `bk factory --bottles dist` writes — unioned into
      # the GitHub Pages mirror by pages.yml. Named per arch+chunk so pages.yml
      # discovers every slice (it globs dist-*).
      - name: upload dist tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.slug }}-${{ matrix.chunk }}
          path: dist
          if-no-files-found: ignore

      - name: upload failures list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.slug }}-${{ matrix.chunk }}
          path: failures.txt
          if-no-files-found: ignore

      # Per-recipe error tails, so build failures are diagnosable from the
      # artifact alone (container-job logs are not retrievable via the API).
      - name: upload failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-detail-${{ matrix.slug }}-${{ matrix.chunk }}
          path: failures-detail.txt
          if-no-files-found: ignore
