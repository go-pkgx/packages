name: build
on:
  workflow_dispatch:
    inputs:
      recipes:
        description: "space-separated projects to build (blank = recipes.txt)"
        required: false
        default: ""
  # Continuous population: rebuild recipes.txt daily. skip-if-published means
  # only new/updated (project,version,platform) are actually built.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    platform: linux/x86-64 }
          - { runner: ubuntu-24.04-arm, platform: linux/aarch64 }
    runs-on: ${{ matrix.runner }}
    # Phase A isolation: build inside a pinned, controlled debian base (bookworm,
    # glibc 2.36) instead of the drifting runner host — reproducible, no host-tool
    # leakage, and a known glibc floor. (Phase B — building against pkgx's OWN
    # glibc for truly self-contained FROM-scratch bottles — is a bk change.)
    container:
      image: debian:stable-slim
    steps:
      - name: base tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils build-essential gettext jq python3
          # some recipes' configure looks for `python`
          command -v python >/dev/null || ln -sf "$(command -v python3)" /usr/local/bin/python

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: stable }

      - name: install pkgx (bk sources its toolchain via `pkgx +deps`)
        run: |
          curl -fsS https://pkgx.sh | sh
          for d in "$HOME/.local/bin" /usr/local/bin; do
            [ -x "$d/pkgx" ] && { echo "$d" >> "$GITHUB_PATH"; break; }
          done

      - name: install bk
        # GOPROXY=direct: pull the current main straight from GitHub, else the
        # module proxy serves a stale cached @main and CI runs an old bk.
        run: |
          GOPROXY=direct go install github.com/go-pkgx/bk/cmd/bk@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: tool versions
        run: |
          pkgx --version
          bk 2>&1 | head -1 || true

      - name: clone pantry
        run: git clone --depth 1 https://github.com/pkgxdev/pantry

      - name: build + publish bottles
        env:
          PLATFORM: ${{ matrix.platform }}
          RECIPES: ${{ github.event.inputs.recipes }}
          OCI_USERNAME: ${{ github.actor }}
          # The workflow's built-in token (permissions.packages: write above) —
          # no long-lived PAT to manage, auto-rotated per run. Requires the
          # go-pkgx/packages package to grant this repo write access once
          # (package → settings → Manage Actions access → add go-pkgx/factory).
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.BOTTLE_SIGNING_KEY }}
        run: bash factory.sh

      - name: upload failures list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ strategy.job-index }}
          path: failures.txt
          if-no-files-found: ignore
