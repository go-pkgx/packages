name: build
on:
  workflow_dispatch:
    inputs:
      recipes:
        description: "space-separated projects to build (blank = the whole recipes.txt, chunked)"
        required: false
        default: ""
      max_versions:
        description: "cap versions per requested project, newest first (blank = all). Use 1 for a lean latest-only fill."
        required: false
        default: ""
  # Continuous population: rebuild recipes.txt daily. skip-if-published means
  # only new/updated (project,version,platform) are actually built.
  # schedule:  # cron disabled 2026-08-12 (free runners for targeted jobs; workflow_dispatch kept)
    # - cron: "0 6 * * *"

permissions:
  contents: read
  packages: write

env:
  CHUNK: "50"   # projects per matrix job (chunked so the full pantry fans out)

jobs:
  # Split recipes.txt into CHUNK-sized slices and emit a matrix over both linux
  # arches × every chunk, so the whole pantry is built best-effort in parallel.
  # A manual `recipes` input bypasses chunking (one job per arch with just those).
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          if [ -n "${{ github.event.inputs.recipes }}" ]; then
            m='{"include":[{"runner":"ubuntu-latest","platform":"linux/x86-64","slug":"linux-x86-64","chunk":"manual"},{"runner":"ubuntu-24.04-arm","platform":"linux/aarch64","slug":"linux-aarch64","chunk":"manual"}]}'
          else
            total=$(grep -vcE '^[[:space:]]*(#|$)' recipes.txt)
            n=$(( (total + CHUNK - 1) / CHUNK ))
            m=$(jq -cn --argjson n "$n" '{include: [range(0;$n) as $c
              | ({runner:"ubuntu-latest",platform:"linux/x86-64",slug:"linux-x86-64"},
                 {runner:"ubuntu-24.04-arm",platform:"linux/aarch64",slug:"linux-aarch64"})
              + {chunk:($c|tostring)}]}')
          fi
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m" | jq '.include | length | "\(.) build jobs"'

  build:
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    # Phase A isolation: build inside a pinned, controlled debian base (bookworm,
    # glibc 2.36) instead of the drifting runner host — reproducible, no host-tool
    # leakage, and a known glibc floor.
    container:
      image: debian:stable-slim
    steps:
      - name: base tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils build-essential gettext jq python3
          # some recipes' configure looks for `python`
          command -v python >/dev/null || ln -sf "$(command -v python3)" /usr/local/bin/python

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: stable }

      - name: install pkgx (bk sources its toolchain via `pkgx +deps`)
        run: |
          curl -fsS https://pkgx.sh | sh
          for d in "$HOME/.local/bin" /usr/local/bin; do
            [ -x "$d/pkgx" ] && { echo "$d" >> "$GITHUB_PATH"; break; }
          done

      - name: install bk
        # GOPROXY=direct: pull the current main straight from GitHub, else the
        # module proxy serves a stale cached @main and CI runs an old bk.
        run: |
          GOPROXY=direct go install github.com/go-pkgx/bk/cmd/bk@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: clone pantry
        run: git clone --depth 1 https://github.com/pkgxdev/pantry

      - name: build + publish this chunk
        env:
          PLATFORM: ${{ matrix.platform }}
          OCI_USERNAME: ${{ github.actor }}
          # The workflow's native token — no long-lived PAT; the go-pkgx/packages
          # packages are owned by this repo, so GITHUB_TOKEN writes natively.
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.BOTTLE_SIGNING_KEY }}
        run: |
          FORCE=""
          if [ "${{ matrix.chunk }}" = "manual" ]; then
            RECIPES="${{ github.event.inputs.recipes }}"
            FORCE=1   # explicit manual dispatch always rebuilds (bypass skip-if-published → refresh stale bottles)
          else
            start=$(( ${{ matrix.chunk }} * CHUNK + 1 )); end=$(( start + CHUNK - 1 ))
            RECIPES="$(grep -vE '^[[:space:]]*(#|$)' recipes.txt | sed -n "${start},${end}p" | tr '\n' ' ')"
          fi
          # shellcheck disable=SC2086  # RECIPES is intentionally word-split to count projects
          echo "chunk ${{ matrix.chunk }} → $(printf '%s\n' $RECIPES | grep -c .) requested projects${FORCE:+ (FORCE rebuild)}"
          # Optional per-project version cap (manual dispatch), honoured by factory.sh.
          MAX_VERSIONS="${{ github.event.inputs.max_versions }}"
          export RECIPES FORCE MAX_VERSIONS
          bash factory.sh

      # The pkgx dist tree factory.sh writes (bk build --dist dist) — unioned into
      # the GitHub Pages mirror by pages.yml. Named per arch+chunk so pages.yml
      # discovers every slice (it globs dist-*).
      - name: upload dist tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.slug }}-${{ matrix.chunk }}
          path: dist
          if-no-files-found: ignore

      - name: upload failures list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.slug }}-${{ matrix.chunk }}
          path: failures.txt
          if-no-files-found: ignore

      # Per-recipe error tails, so build failures are diagnosable from the
      # artifact alone (container-job logs are not retrievable via the API).
      - name: upload failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-detail-${{ matrix.slug }}-${{ matrix.chunk }}
          path: failures-detail.txt
          if-no-files-found: ignore
