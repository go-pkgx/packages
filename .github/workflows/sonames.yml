# Can the bottles we publish actually load?
#
# ⛔ WHY IT EXISTS: THE TOOL WAS ALREADY WRITTEN AND NOTHING RAN IT.
# `bk unresolved` reads every ELF and Mach-O in an installed closure and
# reports each reference the store cannot answer. It is written and tested,
# and on 2026-10-23 `git grep unresolved .github/workflows` in this
# repository returned NOTHING. A control that exists and is not wired to
# anything is not a control.
#
# What that cost, measured the same day. The published `python.org 3.14.7`
# for linux/x86-64:
#
#   _ssl.cpython-314-x86_64-linux-gnu.so      NEEDED libssl.so.1.1 libcrypto.so.1.1
#   _hashlib.cpython-314-x86_64-linux-gnu.so  NEEDED libcrypto.so.1.1
#
# and this registry publishes no openssl 1.x — every one of the 48 is 3.x or
# 4.x. So python's `ssl` and `hashlib` could not load at all on that
# platform, and every build that fetches over HTTPS died there. The same
# bottle for linux/aarch64 needs `libssl.so.3`: one project, one version,
# two platforms, one of them wrong.
#
# It surfaced because a user's `pkgx openstack user list` failed — the
# longest possible way to learn it, through a package four layers above the
# broken one.
#
# `overrides/python.org.hcl` had already retargeted the recipe's `^1.1` pin
# to `^3`, and that fixed RESOLUTION. An override moves a recipe; a
# DT_NEEDED compiled into a bottle published earlier does not move with it.
# Nothing compared the two.
name: can what we publish load

on:
  schedule:
    # Sunday 03:00 UTC. catalogue.yml publishes Monday 05:00, so this reads
    # a settled catalogue rather than racing one, and a finding is waiting
    # on Monday morning rather than at the end of the week.
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      chunks:
        description: "how many chunks to cut the project list into (blank = 14). The job matrix is built from this, so a small platform can ask for a few: 14 chunks over linux/s390x's handful of bottled projects would leave most of them empty, which is an error."
        required: false
        default: ""
      platform:
        description: "which platform to audit, e.g. linux/aarch64 or darwin/x86-64 (blank = linux/x86-64, the weekly one). `pkgs catalog platforms` lists what the registry publishes."
        required: false
        default: ""

permissions:
  contents: read

env:
  # Deps from the module proxy, OUR modules straight from GitHub. `GOPROXY=direct`
  # alone made the bootstrap depend on every vanity-import host in the closure,
  # and gopkg.in's hours of 502s on 2026-10-12 failed the darwin lane twice
  # having built nothing. Measured, and kept uniform across the workflows, by
  # ./goproxycheck.
  GOPROXY: https://proxy.golang.org,direct
  GONOPROXY: github.com/go-pkgx/*

jobs:
  # ⛔ THE MATRIX AND THE CHUNK COUNT ARE ONE NUMBER NOW. They were two: a
  # literal [0..13] here beside a `chunks` input defaulting to 14, with
  # nothing making them agree. Dispatched with chunks=2, twelve of the
  # fourteen jobs refused as out of range — measured 2026-10-25, within a
  # minute of shipping the input. The opposite is worse for a small
  # platform: 14 chunks over linux/s390x's handful of bottled projects
  # leaves most of them empty, also an error. So the fixed matrix made the
  # narrow run the tool explicitly supports impossible to request.
  #
  # The arithmetic lives in the tested program, not in `seq`/`jq` here.
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.n.outputs.chunks }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - id: n
        run: |
          echo "chunks=$(go run ./sonamesweep -chunk-list -chunks "${{ inputs.chunks || '14' }}")" >> "$GITHUB_OUTPUT"

  sweep:
    needs: plan
    # ⛔ ONE PLATFORM PER RUN, SAID OUT LOUD — but no longer only ONE
    # platform. Until bk v0.34.0 `bk unresolved` installed for the host, so
    # an ubuntu runner could answer for linux/x86-64 and nothing else, and
    # sonamesweep refused any other catalogue rather than report this
    # machine's bottles under its name. The weekly run found 967
    # unresolvable references there while the other five platforms went
    # unasked — the shape vulnscan.yml spent two months in.
    #
    # bottle v0.55.0 made the closure platform-explicit and bk v0.34.0
    # exposed it, so this one ubuntu runner can audit any of the six. The
    # SCHEDULE still covers one, because ~1400 closure installs is about
    # ten hours of wall clock and six of those weekly is not a thing to
    # pretend to do; `platform:` on a dispatch covers the others on demand,
    # and a rotation is the next step once its cost is measured rather than
    # guessed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # ⛔ Bounded on purpose. Each project's closure is installed into its
      # OWN store (a shared one rescues a missing reference by accident), so
      # this is ~1400 closure installs per platform. Four at a time keeps a
      # weekly audit from being the reason somebody's build waits — my own
      # sweeps have starved this account's runners before.
      max-parallel: 4
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }

      # @main, and GONOPROXY (workflow env:) keeps that honest against a
      # stale proxy cache: the question "can this load" should be answered
      # by the code that answers it best today.
      - name: install bk and pkgs
        run: |
          go install github.com/go-pkgx/bk/cmd/bk@main
          go install github.com/go-pkgx/pkgx/cmd/pkgs@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # PULL the published catalogue rather than build one: this audits what
      # is PUBLISHED, so the list of subjects has to come from the registry
      # and not from a pantry checkout that may be ahead of it. PKGX_VERIFY
      # is on by default, so an unsigned catalogue stops the job here.
      - name: the published catalogue for ${{ inputs.platform || 'linux/x86-64' }}
        env:
          PKGX_DIR: ${{ runner.temp }}/pkgx
          PLATFORM: ${{ inputs.platform || 'linux/x86-64' }}
        run: |
          pkgs catalog update --platform "$PLATFORM"
          # os/arch -> os-arch is the name `pkgs catalog update` writes, and
          # the baseline is PER PLATFORM: a reference known on linux must not
          # mask a new one on darwin.
          echo "SLUG=${PLATFORM/\//-}" >> "$GITHUB_ENV"

      # sonamesweep prints which chunk it swept and how many projects that
      # was, so "clean" in this log is never mistaken for "clean overall".
      # It exits 2 — not 0 — for every way of sweeping nothing: no
      # catalogue, no bottled project in it, an empty chunk, or a catalogue
      # for a platform this machine is not.
      #
      # ⛔ -baseline, BECAUSE RED ON EVERYTHING IS FURNITURE. The full sweep
      # of 2026-10-24 measured 967 unresolvable references over 259 of the
      # 1407 bottled projects, owned by 100 bottles — tcl-lang.org 218,
      # haskell.org 152, python.org 82, kerberos.org 60. A gate that fails
      # on ANY finding would be red every week over a backlog nobody
      # introduced that week, and the one reference that matters would be
      # somewhere inside it. vulnscan.yml carries the same note and the
      # same -fail-on-new answer.
      #
      # So: red only on a reference that is NOT in this platform's baseline.
      # -out keeps recording, because the fourteen files it uploads are how
      # the baseline is regenerated — `sonamesweep -merge`, which refuses
      # an incomplete set rather than quietly dropping a chunk.
      #
      # ⛔ THE BASELINE IS PER PLATFORM. One shared file would let a
      # reference known on linux mask a new one on darwin — the gate would
      # be green about a platform it had just learned something bad about.
      # A platform with no baseline yet has none to mask with: the file is
      # named and missing, which sonamesweep treats as an error rather than
      # as an empty baseline, so the first sweep of a new platform says
      # "record me" instead of reporting 900 fresh findings.
      - name: chunk ${{ matrix.chunk }} of ${{ inputs.chunks || '14' }} on ${{ inputs.platform || 'linux/x86-64' }}
        env:
          PKGX_DIR: ${{ runner.temp }}/pkgx
        run: |
          go run ./sonamesweep \
            -catalog "$RUNNER_TEMP/pkgx/catalog/$SLUG.json" \
            -chunk ${{ matrix.chunk }} \
            -chunks "${{ inputs.chunks || '14' }}" \
            -baseline "sonames/baseline-$SLUG.txt" \
            -out "$RUNNER_TEMP/chunk-${{ matrix.chunk }}.txt"

      # if: always(), because the chunk that FAILS is the one whose findings
      # are worth keeping. Without this the artefact exists only for the
      # chunks that had nothing to report.
      - name: keep this chunk's findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The platform is in the name, so `gh run download -n` can fetch
          # one platform's fourteen and `sonamesweep -merge` cannot mix two
          # platforms' findings into one baseline.
          name: sonames-${{ env.SLUG }}-chunk-${{ matrix.chunk }}
          path: ${{ runner.temp }}/chunk-${{ matrix.chunk }}.txt
          if-no-files-found: warn
