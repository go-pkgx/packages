# GitHub Pages deployer — publishes the browsable registry at
# https://go-pkgx.github.io/packages : the go-pkgx/registry-viewer WASM app (a
# filterable go-widgets tree) as the site root, its registry.json data, and a
# no-JS list.html fallback.
#
# registry.json is built from the AUTHORITATIVE catalog — the ghcr OCI registry
# (ghcr.io/go-pkgx/packages) — via the `catalog` tool, which probes ghcr
# ANONYMOUSLY (public packages grant an anonymous pull token), so no token is
# needed. The actual package tarballs are NOT served here: every package is a
# signed OCI artifact in ghcr for all platforms (linux/darwin/windows), consumed
# with PKGX_DIST=oci://ghcr.io/go-pkgx/packages. Keeping the multi-GB tarball tree
# off Pages is deliberate — it exceeds the Pages site-size limit and is redundant
# with OCI. The site stays small (viewer + JSON + HTML).
name: pages
on:
  workflow_dispatch:
  # schedule:  # cron disabled 2026-08-12 (free runners for targeted jobs; workflow_dispatch kept)
    # - cron: "0 11 * * *"

permissions: { contents: read, pages: write, id-token: write }

# Only one Pages deploy at a time.
concurrency: { group: registry-deploy, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.dep.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4 # provides the catalog tool + go.mod for `go run ./catalog`

      - uses: actions/setup-go@v5
        with: { go-version: stable }

      - name: Generate registry.json from the ghcr OCI catalog + build list.html
        run: |
          mkdir -p site
          # Static Pages (workflow source, no Jekyll) serves files verbatim.
          touch site/.nojekyll
          # registry.json: the data the WASM viewer counts and renders — one
          # {name,os,arch,version} row per published platform, enumerated from ghcr
          # anonymously (no token). The AUTHORITATIVE source, so counts are exact.
          go run ./catalog > site/registry.json
          echo "registry.json rows: $(jq 'length' site/registry.json) across $(jq '[.[].name]|unique|length' site/registry.json) packages"
          # list.html: a plain, no-JS/accessible table fallback (package · platform · version).
          n=$(jq 'length' site/registry.json)
          rows=$(jq -r '.[] | "<tr><td>\(.name)</td><td>\(.os)/\(.arch)</td><td>\(.version)</td></tr>"' site/registry.json)
          {
            echo '<!doctype html><meta charset="utf-8"><title>go-pkgx package registry — list</title>'
            echo '<style>body{font:15px/1.5 system-ui,sans-serif;max-width:64rem;margin:2rem auto;padding:0 1rem}'
            echo 'table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:.25rem .75rem;border-bottom:1px solid #8884}'
            echo '@media(prefers-color-scheme:dark){body{background:#111;color:#eee}}</style>'
            echo "<h1>go-pkgx package registry</h1><p><b>$n</b> platform builds · <a href=\"./\">interactive tree view</a> · installed from <code>oci://ghcr.io/go-pkgx/packages</code></p>"
            echo '<table><thead><tr><th>package</th><th>platform</th><th>version</th></tr></thead><tbody>'
            echo "$rows"
            echo '</tbody></table>'
          } > site/list.html

      - name: Build the WASM tree-view viewer (go-widgets) → site root
        run: |
          git clone --depth 1 https://github.com/go-pkgx/registry-viewer
          # build.sh consumes registry.json and emits dist/{app.wasm, wasm_exec.js,
          # index.html, registry.json}. index.html becomes the site root (the
          # interactive viewer); registry.json feeds it and the no-JS list.html.
          ( cd registry-viewer && bash build.sh "$GITHUB_WORKSPACE/site/registry.json" )
          cp registry-viewer/dist/app.wasm registry-viewer/dist/wasm_exec.js \
             registry-viewer/dist/index.html site/
          echo "site contents:"; du -sh site; ls -la site

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: dep
        uses: actions/deploy-pages@v4
