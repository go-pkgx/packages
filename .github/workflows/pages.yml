# GitHub Pages deployer / aggregator — the single place the pkgx dist mirror at
# https://go-pkgx.github.io/packages is built and published.
#
# For each of the four build workflows (build.yml, darwin.yml, windows.yml,
# windows-rust.yml) it downloads the `dist-*` artifacts of that workflow's latest
# SUCCESSFUL run and unions every dist tree into one combined site
# (`<project>/<os>/<arch>/…`, `versions.txt` unioned+sorted so all platforms
# coexist). It then emits registry.json and builds the go-pkgx/registry-viewer
# WASM app (a filterable go-widgets tree, name/os/arch/version) as the site root,
# with a no-JS list.html fallback. The same packages are also published as signed
# OCI artifacts to ghcr.io/go-pkgx/packages by those build workflows.
#
# Runs on its own daily schedule AFTER the builds (linux 06:00 … rust 09:00), so
# it always deploys the freshest successful run of each platform.
name: pages
on:
  workflow_dispatch:
  schedule:
    # After all four build factories (06:00–09:00).
    - cron: "0 11 * * *"

permissions: { contents: read, actions: read, packages: read, pages: write, id-token: write }

# Only one Pages deploy at a time (the build workflows no longer deploy Pages).
concurrency: { group: registry-deploy, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.dep.outputs.page_url }}" }
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - name: Download dist-* artifacts from every build workflow's latest success
        run: |
          mkdir -p dl
          for wf in build.yml darwin.yml windows.yml windows-rust.yml; do
            rid=$(gh run list --workflow "$wf" --status success -L1 \
                    --repo "$GITHUB_REPOSITORY" --json databaseId \
                    --jq '.[0].databaseId // empty')
            if [ -z "$rid" ]; then
              echo "no successful run for $wf yet — skipping"; continue
            fi
            echo "downloading dist-* from $wf run $rid"
            # gh run download exits non-zero if the pattern matches nothing —
            # tolerate it so a run with no dist artifacts does not fail the deploy.
            gh run download "$rid" --repo "$GITHUB_REPOSITORY" \
              -p 'dist-*' -D "dl/$wf" 2>/dev/null \
              || echo "no dist-* artifacts in $wf run $rid"
          done

      - name: Merge all dist trees into one site/ (versions.txt unioned+sorted)
        run: |
          mkdir -p site
          # gh run download lays each artifact at dl/<wf>/<artifact-name>/…; each
          # such dir is a pkgx dist tree rooted at <project>/<os>/<arch>/…. Walk
          # every file: copy through, except versions.txt which is union+sorted so
          # the same <project>/<os>/<arch> from multiple sources coexists.
          find dl -mindepth 2 -maxdepth 2 -type d | while read -r src; do
            [ -d "$src" ] || continue
            ( cd "$src" && find . -type f ) | while read -r rel; do
              rel=${rel#./}
              mkdir -p "site/$(dirname "$rel")"
              if [ "$(basename "$rel")" = versions.txt ]; then
                cat "$src/$rel" "site/$rel" 2>/dev/null \
                  | sort -u -V > "site/$rel.tmp" && mv "site/$rel.tmp" "site/$rel"
              else
                cp "$src/$rel" "site/$rel"
              fi
            done
          done

      - name: Generate registry.json
        run: |
          # Static Pages (workflow source, no Jekyll) serves files verbatim.
          touch site/.nojekyll
          # registry.json: one row per (name, os, arch, version) — the data the
          # WASM tree-view viewer fetches. name may contain '/', but os and arch
          # are always the last two path components before v<ver>.tar.gz.
          # shellcheck disable=SC2016  # backrefs in the sed replacement are literal
          find site -name 'v*.tar.gz' \
            | sed -E 's|site/(.*)/([^/]+)/([^/]+)/v(.*)\.tar\.gz|{"name":"\1","os":"\2","arch":"\3","version":"\4"}|' \
            | jq -s 'sort_by(.name,.os,.arch,.version)' > site/registry.json
          echo "registry.json rows: $(jq 'length' site/registry.json)"

      - name: Stamp rows with ghcr publish dates + build the no-JS list.html
        run: |
          # Annotate each row with `published` (the date the OCI version was first
          # pushed, from the ghcr container version's created_at). One API call per
          # distinct package; a package with no ghcr version just gets "".
          : > /tmp/stamps.tsv
          for name in $(jq -r '.[].name' site/registry.json | sort -u); do
            enc=$(jq -rn --arg p "packages/$name" '$p|@uri')
            gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/$enc/versions" --paginate 2>/dev/null \
              | jq -r --arg n "$name" '.[] | .created_at as $c
                  | (.metadata.container.tags[]? | select(startswith("sha256-")|not))
                  | [$n+"|"+., ($c|split("T")[0])] | @tsv' >> /tmp/stamps.tsv || true
          done
          jq -Rn '[inputs|split("\t")|{key:.[0],value:.[1]}]|from_entries' /tmp/stamps.tsv > /tmp/stamps.json
          jq --slurpfile s /tmp/stamps.json \
            'map(. + {published: ($s[0][(.name+"|"+.version)] // "")})' \
            site/registry.json > /tmp/reg.json && mv /tmp/reg.json site/registry.json
          echo "stamped $(jq '[.[]|select(.published!="")]|length') of $(jq 'length' site/registry.json) rows with a publish date"
          # list.html: a plain, no-JS/accessible table fallback (package · platform
          # · version · published), built from the stamped registry.json.
          n=$(jq 'length' site/registry.json)
          rows=$(jq -r '.[] | "<tr><td>\(.name)</td><td>\(.os)/\(.arch)</td><td>\(.version)</td><td>\(.published)</td></tr>"' site/registry.json)
          {
            echo '<!doctype html><meta charset="utf-8"><title>go-pkgx package registry — list</title>'
            echo '<style>body{font:15px/1.5 system-ui,sans-serif;max-width:64rem;margin:2rem auto;padding:0 1rem}'
            echo 'table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:.25rem .75rem;border-bottom:1px solid #8884}'
            echo '@media(prefers-color-scheme:dark){body{background:#111;color:#eee}}</style>'
            echo "<h1>go-pkgx package registry</h1><p><b>$n</b> platform builds · <a href=\"./\">interactive tree view</a></p>"
            echo '<table><thead><tr><th>package</th><th>platform</th><th>version</th><th>published</th></tr></thead><tbody>'
            echo "$rows"
            echo '</tbody></table>'
          } > site/list.html

      - uses: actions/setup-go@v5
        with: { go-version: stable }

      - name: Build the WASM tree-view viewer (go-widgets) → site root
        run: |
          git clone --depth 1 https://github.com/go-pkgx/registry-viewer
          # build.sh consumes our real registry.json and emits dist/{app.wasm,
          # wasm_exec.js, index.html, registry.json}. index.html becomes the site
          # root (the interactive viewer); the dist tree + registry.json stay for
          # PKGX_DIST consumers and the no-JS list.html.
          ( cd registry-viewer && bash build.sh "$GITHUB_WORKSPACE/site/registry.json" )
          cp registry-viewer/dist/app.wasm registry-viewer/dist/wasm_exec.js \
             registry-viewer/dist/index.html site/
          echo "viewer wired:"; ls -la site/app.wasm site/index.html

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: dep
        uses: actions/deploy-pages@v4
