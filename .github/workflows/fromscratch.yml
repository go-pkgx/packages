name: fromscratch
# Continuous PROOF + COVERAGE that published ghcr bottles run in a genuine
# `docker FROM scratch` image — only pkgx bottles, no debian, no system libc.
# For each witness tool: resolve its runtime closure to published bottles
# (fromscratch/mkclosure.sh), build a scratch image (fromscratch/mkscratch.sh),
# and smoke-test it. A closure that is not fully published yet is SKIPPED
# (coverage gap, reported); a tool that builds but whose smoke test fails FAILS
# the job (a real regression).
on:
  workflow_dispatch:
  # schedule:  # cron disabled 2026-08-12 (free runners for targeted jobs; workflow_dispatch kept)
    # 12:00 UTC daily — the 06-11h slots are taken by the other factory workflows.
    # - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  scratch:
    # ubuntu-latest is linux/x86-64 with docker preinstalled → build+run the
    # amd64 scratch images natively (no qemu). Bottles are pulled anonymously
    # from the public ghcr.io/go-pkgx/packages registry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mkclosure.sh parses the pantry recipes' runtime dependencies.
      - name: clone pantry
        run: git clone --depth 1 https://github.com/pkgxdev/pantry

      - name: FROM-scratch coverage panel
        run: |
          set -uo pipefail
          # Each entry: <project>|<in-image entrypoint, {V}=root version dir>|<smoke args>
          # Smoke args default to a version flag — enough to prove the binary
          # loads its whole closure and runs under the pkgx glibc loader.
          TOOLS='
          lz4.org|/pkgx/lz4.org/{V}/bin/lz4|--version
          openssl.org|/pkgx/openssl.org/{V}/bin/openssl|version
          tukaani.org/xz|/pkgx/tukaani.org/xz/{V}/bin/xz|--version
          facebook.com/zstd|/pkgx/facebook.com/zstd/{V}/bin/zstd|--version
          sqlite.org|/pkgx/sqlite.org/{V}/bin/sqlite3|--version
          rsync.samba.org|/pkgx/rsync.samba.org/{V}/bin/rsync|--version
          jqlang.github.io|/pkgx/jqlang.github.io/{V}/bin/jq|--version
          gnu.org/wget|/pkgx/gnu.org/wget/{V}/bin/wget|--version
          curl.se|/pkgx/curl.se/{V}/bin/curl|--version
          git-scm.org|/pkgx/git-scm.org/{V}/bin/git|--version
          '
          PASS=""; SKIP=""; FAIL=""
          while IFS='|' read -r proj entry smoke; do
            [ -n "${proj:-}" ] || continue
            proj="$(echo "$proj" | xargs)"; entry="$(echo "$entry" | xargs)"; smoke="$(echo "$smoke" | xargs)"
            tag="scratch-$(echo "$proj" | tr '/.' '--')"
            echo "::group::$proj"
            if bash fromscratch/mkclosure.sh amd64 "$tag" "$entry" "$proj"; then
              if docker run --rm --platform linux/amd64 "$tag" $smoke; then
                echo "PASS $proj"; PASS="$PASS $proj"
              else
                echo "SMOKE FAILED $proj"; FAIL="$FAIL $proj"
              fi
            else
              rc=$?
              if [ "$rc" = "3" ]; then
                echo "SKIP $proj (closure not fully published for amd64)"; SKIP="$SKIP $proj"
              else
                echo "BUILD FAILED $proj (rc=$rc)"; FAIL="$FAIL $proj"
              fi
            fi
            echo "::endgroup::"
          done <<< "$TOOLS"
          echo "================ FROM-scratch coverage ================"
          echo "PASS (run from scratch):$PASS"
          echo "SKIP (closure gap):$SKIP"
          echo "FAIL (built but broken):$FAIL"
          echo "======================================================="
          # Only a built-but-broken tool fails the job; coverage gaps do not.
          [ -z "$FAIL" ] || { echo "::error::from-scratch regressions:$FAIL"; exit 1; }
