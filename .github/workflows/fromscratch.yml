name: fromscratch
# Continuous PROOF + COVERAGE that published ghcr bottles run FROM SCRATCH —
# only pkgx bottles, no debian, no system libc.
#
# For each witness tool, `pkgm image` emits a `FROM scratch` Containerfile whose
# `RUN` step uses pkgm ITSELF, inside the image, to install the tool's whole
# runtime closure over HTTPS and wire the pkgx loader. This job executes exactly
# that, in an EMPTY chroot rather than a docker image: the ENV and argv are read
# out of the Containerfile pkgm emits, so the two cannot drift, and no container
# engine is involved.
#
# A closure not yet fully published makes the install fail → reported as a
# coverage gap (SKIP); a tool that installs but whose smoke run fails FAILS the
# job.
#
# Why not docker: this runs on our own Incus pool, whose runner image carries
# neither docker nor podman. A chroot needs neither, and proves the same thing
# more directly — there is no image layer machinery between the bottles and the
# assertion. Measured 2026-08-27: lz4 installs itself from ghcr into an empty
# directory and prints its version, inside an Incus container.
on:
  workflow_dispatch:
  # schedule:  # cron disabled 2026-08-12 (free runners for targeted jobs; workflow_dispatch kept)
    # 12:00 UTC daily — the 06-11h slots are taken by the other factory workflows.
    # - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  scratch:
    # Our own GARM/Incus pool: linux/x86-64, so the amd64 closures install and
    # run natively (no qemu). Bottles are pulled anonymously from the public
    # ghcr.io/go-pkgx/packages registry by pkgm, from inside the chroot.
    runs-on: [self-hosted, incus, amd64]
    steps:
      # The pool's runner image is a plain debian cloud image: no git, and
      # `GOPROXY=direct` shells out to it ("unable to resolve git version:
      # exec: git: executable file not found"). jq and the chroot's unshare
      # come from the base system; git does not.
      - name: base tools
        run: |
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          command -v git >/dev/null && command -v jq >/dev/null || {
            $SUDO apt-get update -qq
            $SUDO apt-get install -y --no-install-recommends git jq ca-certificates
          }

      - uses: actions/setup-go@v5
        with: { go-version: stable }

      # ONE static (CGO_ENABLED=0) pkgm binary serves both roles: the host
      # `pkgm image` that emits the Containerfile, and the `/pkgm` copied INTO the
      # scratch image (it must run with no system libc). GOPROXY=direct pulls the
      # current main straight from GitHub (the module proxy can serve a stale
      # cached @main).
      - name: install pkgm (static)
        run: |
          CGO_ENABLED=0 GOPROXY=direct go install github.com/go-pkgx/pkgm@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: FROM-scratch coverage panel
        run: |
          set -uo pipefail
          PKGM="$(command -v pkgm)"
          # Corrected-recipe overlay (e.g. curl/wget openssl constraint) consulted
          # by the in-image `pkgm install` before the upstream pantry.
          OVERLAY="https://raw.githubusercontent.com/go-pkgx/pantry-overlay/main/projects"
          # <project> then its smoke args (space-separated). No `|`/`xargs` trim:
          # `xargs` with no command runs /bin/echo, and GNU echo eats a leading
          # --version as its own flag — the value must never be executed.
          TOOLS=(
            "lz4.org --version"
            "openssl.org version"
            "tukaani.org/xz --version"
            "facebook.com/zstd --version"
            "sqlite.org --version"
            "rsync.samba.org --version"
            "perl.org --version"
            "stedolan.github.io/jq --version"
            "gnu.org/wget --version"
            "curl.se --version"
            "git-scm.org --version"
          )
          command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq; }
          work="$(mktemp -d)"
          PASS=""; SKIP=""; FAIL=""
          # scratch <root> <argv...> — run argv in an empty root with the ENV the
          # Containerfile declares. --mount --pid --fork is the isolation a
          # container runtime would give; the network namespace is deliberately
          # shared, because the whole point is that pkgm fetches over HTTPS.
          scratch() {
            local root="$1"; shift
            sudo env -i "${SCRATCH_ENV[@]}" \
              unshare --mount --pid --fork /usr/sbin/chroot "$root" "$@"
          }
          for entry in "${TOOLS[@]}"; do
            # shellcheck disable=SC2086  # deliberate word-split: proj + smoke args
            set -- $entry
            proj="$1"; shift; smoke=("$@")
            tag="scratch-$(printf '%s' "$proj" | tr '/.' '--')"
            echo "::group::$proj"
            # The Containerfile is still the source of truth for HOW a
            # from-scratch install is done — its ENV and its RUN argv are read
            # back below, so this job cannot drift from what `pkgm image`
            # promises an end user.
            cf="$work/Containerfile"
            pkgm image -overlay "$OVERLAY" "$proj" > "$cf"
            mapfile -t SCRATCH_ENV < <(sed -n 's/^ENV //p' "$cf")
            mapfile -t INSTALL_ARGV < <(sed -n 's/^RUN //p' "$cf" | jq -r ".[]")
            mapfile -t RUN_ARGV < <(sed -n 's/^ENTRYPOINT //p' "$cf" | jq -r ".[]")
            if [ "${#INSTALL_ARGV[@]}" -eq 0 ] || [ "${#RUN_ARGV[@]}" -eq 0 ]; then
              echo "FAILED $proj (pkgm image emitted no RUN/ENTRYPOINT)"; FAIL="$FAIL $proj"
              echo "::endgroup::"; continue
            fi
            # An EMPTY root: /pkgm, a place for temp files, the resolver
            # configuration a container runtime injects too, and the handful of
            # device nodes every runtime creates in a `FROM scratch` container.
            # Nothing else — no libc, no /usr, no distro.
            #
            # /dev is not a concession: without it `git` dies with "could not
            # open '/dev/null' for reading and writing", which says nothing about
            # its closure and everything about the root being less than what
            # docker would have handed it.
            root="$work/$tag"; rm -rf "$root"
            mkdir -p "$root/root" "$root/etc" "$root/tmp" "$root/dev"; chmod 1777 "$root/tmp"
            cp /etc/resolv.conf "$root/etc/resolv.conf"
            for d in null:1:3 zero:1:5 full:1:7 random:1:8 urandom:1:9 tty:5:0; do
              n=${d%%:*}; rest=${d#*:}
              sudo mknod -m 666 "$root/dev/$n" c "${rest%%:*}" "${rest#*:}"
            done
            cp "$PKGM" "$root/pkgm"; chmod 755 "$root/pkgm"
            # A failed install == the closure is not fully published for amd64 yet
            # (a coverage gap, not a regression). Guarded so `bash -e` never aborts
            # the panel mid-loop — every witness is exercised.
            if ! scratch "$root" "${INSTALL_ARGV[@]}"; then
              echo "SKIP $proj (closure not fully published for amd64)"; SKIP="$SKIP $proj"
              sudo rm -rf "$root"; echo "::endgroup::"; continue
            fi
            if scratch "$root" "${RUN_ARGV[@]}" "${smoke[@]}"; then
              echo "PASS $proj"; PASS="$PASS $proj"
            else
              echo "FAILED $proj (installed but smoke run broke)"; FAIL="$FAIL $proj"
            fi
            # 63 MB per witness on a VM with a few GB free: reclaim as we go.
            sudo rm -rf "$root"
            echo "::endgroup::"
          done
          echo "================ FROM-scratch coverage ================"
          echo "PASS (run from scratch):$PASS"
          echo "SKIP (closure gap):$SKIP"
          echo "FAIL (installed but broken):$FAIL"
          echo "======================================================="
          # Only a built-but-broken tool fails the job; coverage gaps do not.
          [ -z "$FAIL" ] || { echo "::error::from-scratch regressions:$FAIL"; exit 1; }
