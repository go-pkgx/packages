name: fromscratch
# Continuous PROOF + COVERAGE that published ghcr bottles run in a genuine
# `docker FROM scratch` image — only pkgx bottles, no debian, no system libc.
#
# For each witness tool, `pkgm image` emits a `FROM scratch` Containerfile whose
# `RUN` step uses pkgm ITSELF, inside the image, to install the tool's whole
# runtime closure over HTTPS and wire the pkgx loader. So the from-scratch
# install (and this proof) run in the container, exactly like an end user's
# `pkgm install` — no host-side rootfs staging, no bespoke builder. A closure
# not yet fully published makes the `docker build` fail → reported as a coverage
# gap (SKIP); a tool that builds but whose smoke run fails FAILS the job.
on:
  workflow_dispatch:
  # schedule:  # cron disabled 2026-08-12 (free runners for targeted jobs; workflow_dispatch kept)
    # 12:00 UTC daily — the 06-11h slots are taken by the other factory workflows.
    # - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  scratch:
    # ubuntu-latest is linux/x86-64 with docker preinstalled → build+run the
    # amd64 scratch images natively (no qemu). Bottles are pulled anonymously
    # from the public ghcr.io/go-pkgx/packages registry by pkgm, in-image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with: { go-version: stable }

      # ONE static (CGO_ENABLED=0) pkgm binary serves both roles: the host
      # `pkgm image` that emits the Containerfile, and the `/pkgm` copied INTO the
      # scratch image (it must run with no system libc). GOPROXY=direct pulls the
      # current main straight from GitHub (the module proxy can serve a stale
      # cached @main).
      - name: install pkgm (static)
        run: |
          CGO_ENABLED=0 GOPROXY=direct go install github.com/go-pkgx/pkgm@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: FROM-scratch coverage panel
        run: |
          set -uo pipefail
          PKGM="$(command -v pkgm)"
          # <project> then its smoke args (space-separated). No `|`/`xargs` trim:
          # `xargs` with no command runs /bin/echo, and GNU echo eats a leading
          # --version as its own flag — the value must never be executed.
          TOOLS=(
            "lz4.org --version"
            "openssl.org version"
            "tukaani.org/xz --version"
            "facebook.com/zstd --version"
            "sqlite.org --version"
            "rsync.samba.org --version"
            "perl.org --version"
            "jqlang.github.io --version"
            "gnu.org/wget --version"
            "curl.se --version"
            "git-scm.org --version"
          )
          work="$(mktemp -d)"; cp "$PKGM" "$work/pkgm"
          PASS=""; SKIP=""; FAIL=""
          for entry in "${TOOLS[@]}"; do
            # shellcheck disable=SC2086  # deliberate word-split: proj + smoke args
            set -- $entry
            proj="$1"; shift; smoke=("$@")
            tag="scratch-$(printf '%s' "$proj" | tr '/.' '--')"
            echo "::group::$proj"
            # Vendor-neutral OCI Containerfile (podman/buildah pick it up by
            # name; docker builds it with -f).
            pkgm image "$proj" > "$work/Containerfile"
            # A failed build == the closure is not fully published for amd64 yet
            # (a coverage gap, not a regression). Guarded so `bash -e` never aborts
            # the panel mid-loop — every witness is exercised.
            if ! docker build --platform linux/amd64 -f "$work/Containerfile" -t "$tag" "$work"; then
              echo "SKIP $proj (closure not fully published for amd64)"; SKIP="$SKIP $proj"
              echo "::endgroup::"; continue
            fi
            if docker run --rm --platform linux/amd64 "$tag" "${smoke[@]}"; then
              echo "PASS $proj"; PASS="$PASS $proj"
            else
              echo "FAILED $proj (built but smoke run broke)"; FAIL="$FAIL $proj"
            fi
            echo "::endgroup::"
          done
          echo "================ FROM-scratch coverage ================"
          echo "PASS (run from scratch):$PASS"
          echo "SKIP (closure gap):$SKIP"
          echo "FAIL (built but broken):$FAIL"
          echo "======================================================="
          # Only a built-but-broken tool fails the job; coverage gaps do not.
          [ -z "$FAIL" ] || { echo "::error::from-scratch regressions:$FAIL"; exit 1; }
