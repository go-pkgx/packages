name: reproduce

# Build one recipe TWICE in the same sovereign rootfs and ask whether the two
# bottles are the same bottle.
#
# ⛔⛔ NOTHING IN THIS FACTORY HAS EVER ASKED THAT ON A SCHEDULE, AND THE ONE
# TIME IT WAS ASKED BY HAND IT FOUND A DEFECT. On 2026-09-29 zlib.net 1.3.2
# was built on the s390x seed VM before and after the VM was replaced:
#
#   every FILE byte-identical, 14 entries either side
#   directories   0755 vs 0775      the two hosts' umasks, 0022 and 0002
#
# `bottlepkg.normalise` fixes that class now, citing reproducible-builds.org.
# A class of defect that is only ever found by hand is a class that comes
# back.
#
# ⛔ IT IS DISPATCH-ONLY, AND THAT IS A COST DECISION STATED RATHER THAN
# HIDDEN. Two builds is twice the compile, in a rootfs that takes minutes to
# stage — so this is run deliberately, on one small recipe, before and after
# anything that touches the builder, the toolchain or the packer. Putting it
# on a cron would make it the most expensive job in the fleet and the first
# one somebody disables.
#
# ⛔ WHAT A FAILURE HERE MEANS. Not "the build is broken": the bottles work.
# It means two builds of ONE recipe from ONE source tree with ONE toolchain
# produced different bytes, so nothing downstream — a lock, a digest, a
# provenance statement — can promise what it appears to promise. The report
# says WHICH entries and in WHAT way, because "the digests differ" is the
# start of an afternoon with two tarballs rather than a finding.

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: "ONE project to build twice. Small on purpose — this pays for the compile twice."
        required: false
        default: "zlib.net"
      versions:
        description: "pkgx constraint; a BARE version is a RANGE, use '=1.2.3' for exactly one"
        required: false
        default: "=1.3.2"
      arch:
        description: "`x86-64` (default) or `aarch64`"
        required: false
        default: "x86-64"
      ignore_mtime:
        description: "set to 1 to ask 'identical apart from timestamps'. bottlepkg does NOT fix mtime to an epoch, so two builds at different times differ by design — this is a DIFFERENT question, not a looser one"
        required: false
        default: "1"

permissions:
  contents: read
  packages: read

env:
  GOPROXY: https://proxy.golang.org,direct
  GONOPROXY: github.com/go-zpkg/*

jobs:
  reproduce:
    runs-on: ${{ github.event.inputs.arch == 'aarch64' && fromJSON('["self-hosted","incus","arm64"]') || fromJSON('["self-hosted","incus","amd64"]') }}
    timeout-minutes: 330
    env:
      PLATFORM: linux/${{ github.event.inputs.arch || 'x86-64' }}
    steps:
      - name: host tools
        run: |
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          command -v git >/dev/null || { $SUDO apt-get update -qq; $SUDO apt-get install -y --no-install-recommends git ca-certificates; }

      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }

      # ⛔ ASSEMBLED FROM A VARIABLE, so a rename cannot see it: the modules
      # are `zbk/cmd/zbk`, `zpkgx` and `zpkgm`, and the binaries are `zbk`,
      # `zpkgx` and `zpkgm`. See sovereign.yml, where exactly this was missed.
      - name: build zbk, zpkgx and zpkgm (static)
        run: |
          for m in zbk/cmd/zbk zpkgx zpkgm; do
            CGO_ENABLED=0 go install "github.com/go-zpkg/$m@main"
          done
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: clone pantry
        run: git clone --depth 1 https://github.com/pkgxdev/pantry

      # ⛔ THE PANTRY COMMIT IS RECORDED BEFORE ANYTHING IS BUILT. Both builds
      # must come from the SAME source tree, or a difference between them says
      # nothing about reproducibility — it says the recipes moved. A shallow
      # clone taken once and reused for both builds is what guarantees it; the
      # commit is printed so a failing run can be read months later.
      - name: what both builds will be built from
        run: |
          echo "pantry   $(git -C pantry rev-parse HEAD)"
          echo "packages $(git rev-parse HEAD)"
          echo "zbk      $(zbk version)"

      - name: point at the pull-through cache if it answers
        run: |
          echo "ZPKG_DIST=oci://ghcr.io/go-pkgx/packages" >> "$GITHUB_ENV"
          if curl -fsS -m 3 http://10.46.81.1:5111/v2/ >/dev/null 2>&1; then
            echo "ZPKG_CACHE=oci://http://10.46.81.1:5111/go-zpkg/packages" >> "$GITHUB_ENV"
          fi

      - name: stage the sovereign rootfs
        env:
          ZPKG_PANTRY_OVERLAY: https://raw.githubusercontent.com/go-zpkg/pantry-overlay/main/projects
        run: |
          zbk builder \
            --out "$RUNNER_TEMP/rootfs" \
            --platform "$PLATFORM" \
            --toolchain builder/toolchain.txt \
            --bk "$(command -v zbk)" \
            --pkgx "$(command -v zpkgx)" \
            --container
          du -sh "$RUNNER_TEMP/rootfs"

      # ⛔ ONE ROOTFS, TWO BUILDS. Staging twice would compare two rootfs as
      # much as two builds, and the 2026-09-29 defect is precisely what a
      # second environment introduces — this job is about whether the SAME
      # environment gives the same answer twice. Comparing across environments
      # is a different and also useful question; it is not this one, and
      # conflating them would make a failure unattributable.
      #
      # The dist tree is moved aside between runs rather than deleted, so both
      # survive for the comparison and for the artifact.
      - name: build it, twice
        env:
          ZPKG_DIR: /pkgx
          HOME: /root
          ZPKG_PANTRY_OVERLAY: https://raw.githubusercontent.com/go-zpkg/pantry-overlay/main/projects
          QEMU_RESERVED_VA: ${{ github.event.inputs.arch == 'aarch64' && '0x400000000' || '' }}
          JOBS: ${{ github.event.inputs.arch == 'aarch64' && '4' || '' }}
          RECIPES: ${{ github.event.inputs.recipe || 'zlib.net' }}
          VERSIONS: ${{ github.event.inputs.versions || '=1.3.2' }}
          # Always, both times: a skipped build proves nothing, and the second
          # one would otherwise be skipped because the first just published.
          FORCE: "1"
          # Nothing is pushed. This job reads the registry and writes nowhere;
          # its permissions say `packages: read` for the same reason.
          NO_PUBLISH: "1"
        run: |
          set -eu
          root="$RUNNER_TEMP/rootfs"
          for pass in one two; do
            echo "::group::build $pass"
            SOVEREIGN_ADVISORIES="$PWD/advisories" \
            builder/sovereign-build.sh \
              "$root" "$PWD/pantry" "$PWD/overrides" \
              ${VERSIONS:+--versions "$VERSIONS"}
            echo "::endgroup::"
            mv "$root/dist" "$RUNNER_TEMP/dist-$pass"
          done

      # ⛔ THE COMPARISON NAMES BOTH FILES AND REFUSES TO GUESS. If either
      # pass produced no bottle, there is nothing to compare and this must say
      # so — an absent file must not arrive at `zbk reproduce` as a silent
      # zero-entry pass, which is the one way this whole job could report
      # success having proved nothing.
      - name: do the two builds agree
        run: |
          set -eu
          a=$(find "$RUNNER_TEMP/dist-one" -name 'v*.tar.*' | sort | head -1)
          b=$(find "$RUNNER_TEMP/dist-two" -name 'v*.tar.*' | sort | head -1)
          if [ -z "$a" ] || [ -z "$b" ]; then
            echo "::error::one of the two passes produced no bottle (a='$a' b='$b') — nothing was compared"
            exit 1
          fi
          echo "A $a"
          echo "B $b"
          if [ "${{ github.event.inputs.ignore_mtime || '1' }}" = "1" ]; then
            zbk reproduce -ignore-mtime "$a" "$b"
          else
            zbk reproduce "$a" "$b"
          fi

      - name: upload both bottles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reproduce-${{ github.event.inputs.arch || 'x86-64' }}
          path: |
            ${{ runner.temp }}/dist-one
            ${{ runner.temp }}/dist-two
          if-no-files-found: warn
