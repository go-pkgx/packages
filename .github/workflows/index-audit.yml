name: index-audit

# A GATE on the one defect that hides: a bottle pushed to the registry that its
# version's OCI index does not list. The bottle is there, valid and signed;
# `pkgx` says "platform not in index" and the package looks published when it is
# not.
#
# Publishing an index is a read-modify-write on one mutable tag, and four
# publishers race on it (two arches x build.yml + darwin.yml). bottle confirms
# each write twice and bk re-checks the whole batch at the end, which narrows the
# window — it does not close it. Something has to watch.
#
# 137 such entries accumulated unnoticed, found by tripping over one of them in
# a build. They are at 0 now. This is what keeps them there.
#
# What it gates on is DIRECT EVIDENCE: since go-pkgx/bottle#37 each platform's
# manifest carries an uncontended tag of its own, so a manifest that is in the
# registry and absent from its version's index is the race, visible, with no
# inference. It cannot have a false positive.
#
# It replaced an inference that could. The old gate called a version carrying
# fewer platforms than its neighbours a lost write, and was red on 221 of those
# for at least two days — every one of them a build policy rather than a defect.
# python.org carries linux at the newest patch of each minor line and nowhere
# else; libexpat carries darwin at three versions out of 32; libgit2 has linux
# in eras. Not one of the 221 had a manifest to recompose from. That list is
# still printed, because it is the only thing that could see a loss from before
# the platform tags existed — as a list to read, not a lane to go red.
#
# The blind spot is named in the output: the count of omitted manifests is
# printed with the number EXAMINED, because "0 of nothing" reads exactly like
# "0 of everything" and only one of them is a pass.
#
# What it is blind to is HISTORY, not a gap anyone has to close. Measured
# 2026-09-27, openssl.org carries 62 linux platform tags while zlib.net and
# curl.se carry only darwin ones and gnu.org/gperf none at all — which first
# read like publishers that disagree. They do not: bottle's push is the single
# publish path for a build and a mirror alike, and it has tagged every platform
# manifest since go-pkgx/bottle#37. What carries no tag is what was published
# BEFORE that, and the set shrinks on its own as the catalogue is rebuilt.
#
# Not on pull_request: the crawl walks the whole catalogue over the network for
# several minutes, and a PR cannot change what is already published.

on:
  workflow_dispatch:
  schedule:
    # 04:00 UTC, before the other factory lanes would add to it.
    - cron: "0 4 * * *"
  # After a publishing run, when a fresh split index is most likely and cheapest
  # to repair — the operator still has the context.
  workflow_run:
    workflows: [build, darwin]
    types: [completed]

# One audit at a time, and at most one waiting behind it.
#
# It fires on every completed build and darwin run, and the crawl takes hours:
# measured 2026-09-24, a run created at 13:51 waited until 15:14 for a runner
# and was still going at 17:16. Two had piled up from publishes three minutes
# apart, and every repair dispatched that afternoon sat behind them — the pool's
# seven amd64 runners were all busy, and a darwin run cannot even reach macOS
# until its `setup` job gets one of them.
#
# cancel-in-progress stays FALSE on purpose. The audit is longer than the gap
# between publishes, so cancelling the running one would mean it never finishes
# and never reports. False keeps the running audit and collapses everything
# waiting into a single pending run, which is the state that costs one runner
# instead of a queue of them.
concurrency:
  group: index-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    # Our own GARM/Incus pool: 32 cores, ephemeral container per job, tagged
    # [self-hosted, incus, amd64]. Linux work runs here rather than on GitHub's
    # minutes. If the pool is down, jobs queue — swap this line back to
    # `ubuntu-latest` to get moving again.
    runs-on: [self-hosted, incus, amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.1' }

      # No token: the catalog tool probes ghcr anonymously (public packages), and
      # reads the upstream dist's versions.txt to tell a LOST entry from a
      # version that never existed for that platform anywhere.
      - name: audit the published indexes
        env:
          AUDIT: "1"
          CATALOG_CONCURRENCY: "12"
        run: go run ./catalog
