# Windows package factory (Rust) — cross-builds pantry Rust projects to Windows
# packages with mingw-w64 and publishes them to BOTH channels, like linux/darwin:
#   - the signed OCI registry ghcr.io/go-pkgx/packages (via `bk publish`), and
#   - the GitHub Pages pkgx dist mirror (via the central pages.yml aggregator,
#     which unions the `dist-*` artifact this job uploads).
#
# Trigger mirrors build.yml (the linux factory): workflow_dispatch + a daily
# schedule, NOT on:push — so landing this file does not immediately fire a run.
name: windows-rust
on:
  workflow_dispatch:
  # schedule:  # cron disabled 2026-08-12 (free runners for targeted jobs; workflow_dispatch kept)
    # After the Go factory (08:00). The Pages mirror is deployed later by pages.yml.
    # - cron: "0 9 * * *"
permissions: { contents: read, packages: write }
env:
  CHUNK: "6"   # cargo builds are heavy — smaller chunks stay under the 6h job cap
  TRIPLE: "x86_64-pc-windows-gnu"

jobs:
  setup:
    # Our own GARM/Incus pool: 32 cores, ephemeral container per job, tagged
    # [self-hosted, incus, amd64]. A nine-job fan-out once filled the VM's 20 GB
    # root with ENOSPC; runners now get their disks from a 1 TB volume, so the
    # fan-out fits. If the pool is down, jobs queue — swap this line back to
    # `ubuntu-latest` to get moving again.
    runs-on: [self-hosted, incus, amd64]
    outputs: { chunks: "${{ steps.gen.outputs.chunks }}" }
    steps:
      # The Incus runner image is a plain Debian cloud image: no jq, no git, no
      # go. setup-go brings its own, checkout falls back to the API tarball, and
      # jq is one apt line. A no-op wherever it is already there.
      - name: jq
        run: command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq; }
      - uses: actions/checkout@v7
      - id: gen
        run: |
          total=$(grep -c . windows/rust-projects.txt)
          n=$(( (total + CHUNK - 1) / CHUNK ))
          echo "chunks=$(seq 0 $((n-1)) | jq -R . | jq -c -s .)" >> "$GITHUB_OUTPUT"
          echo "$total rust projects → $n chunks"

  build:
    needs: setup
    # Our own GARM/Incus pool: 32 cores, ephemeral container per job, tagged
    # [self-hosted, incus, amd64]. A nine-job fan-out once filled the VM's 20 GB
    # root with ENOSPC; runners now get their disks from a 1 TB volume, so the
    # fan-out fits. If the pool is down, jobs queue — swap this line back to
    # `ubuntu-latest` to get moving again.
    runs-on: [self-hosted, incus, amd64]
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        chunk: ${{ fromJson(needs.setup.outputs.chunks) }}
    steps:
      # The Incus runner image is a plain Debian cloud image: no jq, no git, no
      # go. setup-go brings its own, checkout falls back to the API tarball, and
      # jq is one apt line. A no-op wherever it is already there.
      - name: jq
        run: command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq; }
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - name: install pkgx + bk (for signed OCI publish)
        run: |
          curl -fsS https://pkgx.sh | sh
          for d in "$HOME/.local/bin" /usr/local/bin; do
            [ -x "$d/pkgx" ] && { echo "$d" >> "$GITHUB_PATH"; break; }
          done
          # GOPROXY=direct: pull current main from GitHub, not a stale proxy cache.
          GOPROXY=direct go install github.com/go-pkgx/bk/cmd/bk@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Toolchain (rust + mingw)
        run: |
          rustup target add "$TRIPLE"
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc" >> "$GITHUB_ENV"
          # locate the mingw runtime DLLs to colocate for self-containment
          mgw=$(dirname "$(x86_64-w64-mingw32-gcc -print-libgcc-file-name)")
          echo "MGW_LIB=$mgw" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.chunk }}-${{ hashFiles('windows/rust-projects.txt') }}
      - name: Cross-build chunk ${{ matrix.chunk }} → Windows packages
        env:
          OCI_USERNAME: ${{ github.actor }}
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.BOTTLE_SIGNING_KEY }}
        run: |
          start=$(( ${{ matrix.chunk }} * CHUNK + 1 )); end=$(( start + CHUNK - 1 ))
          # mingw dir holding libwinpthread etc. (sibling of libgcc)
          dlldir=$(dirname "$(dpkg -L gcc-mingw-w64-x86-64 | grep 'libwinpthread-1.dll' | head -1)")
          [ -n "$dlldir" ] || dlldir=/usr/x86_64-w64-mingw32/lib
          # Signing key → temp file, as factory.sh does; skip --sign if unset.
          SIGN_ARGS=()
          if [ -n "${SIGNING_KEY:-}" ]; then
            umask 077; KEYFILE="$(mktemp)"; printf '%s' "$SIGNING_KEY" > "$KEYFILE"
            SIGN_ARGS=(--sign "$KEYFILE"); echo "signing: enabled"
          else
            echo "signing: disabled (no SIGNING_KEY)"
          fi
          sed -n "${start},${end}p" windows/rust-projects.txt | while IFS='|' read -r slug repo bin; do
            [ -n "$slug" ] || continue
            echo "::group::$slug ($repo, bin=$bin)"
            rm -rf src
            ver=$(git ls-remote --tags --refs "https://github.com/$repo" 2>/dev/null \
                  | awk -F/ '{print $NF}' | sed 's/^v//' \
                  | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -1)
            [ -n "$ver" ] || { echo "no tag; skip"; echo "::endgroup::"; continue; }
            git clone --depth 1 --branch "v$ver" "https://github.com/$repo" src 2>/dev/null \
              || git clone --depth 1 --branch "$ver" "https://github.com/$repo" src 2>/dev/null \
              || { echo "clone failed"; echo "::endgroup::"; continue; }
            ( cd src
              timeout 40m cargo build --release --locked --target "$TRIPLE" 2>/tmp/err \
                || timeout 40m cargo build --release --target "$TRIPLE" 2>/tmp/err || true )
            exe=$(find "src/target/$TRIPLE/release" -maxdepth 1 -name "$bin.exe" 2>/dev/null | head -1)
            [ -n "$exe" ] || exe=$(find "src/target/$TRIPLE/release" -maxdepth 1 -name '*.exe' 2>/dev/null | head -1)
            [ -n "$exe" ] || { echo "no windows build"; tail -5 /tmp/err 2>/dev/null; echo "::endgroup::"; continue; }
            realbin=$(basename "$exe" .exe)
            stage="stage/$slug/v$ver/bin"; rm -rf stage; mkdir -p "$stage"
            cp "$exe" "$stage/"
            # colocate mingw runtime DLLs → self-contained on Windows
            for dll in libwinpthread-1.dll libgcc_s_seh-1.dll libstdc++-6.dll; do
              f=$(find /usr -name "$dll" 2>/dev/null | grep -i mingw | head -1)
              [ -n "$f" ] && cp "$f" "$stage/" 2>/dev/null || true
            done
            d="$GITHUB_WORKSPACE/out/$slug/windows/x86-64"; mkdir -p "$d"
            tar -czf "$d/v$ver.tar.gz" -C stage "$slug/v$ver"
            echo "$ver" > "$d/versions.txt"
            mkdir -p "$GITHUB_WORKSPACE/out/$slug"
            printf 'provides:\n  - bin/%s\n' "$realbin" > "$GITHUB_WORKSPACE/out/$slug/package.yml"
            # Publish the same package to the signed OCI registry (best-effort:
            # a publish failure must not abort the chunk).
            if SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-1700000000}" \
               bk publish --to oci://ghcr.io/go-pkgx/packages --project "$slug" \
                 --version "$ver" --platform windows/x86-64 "${SIGN_ARGS[@]}" \
                 "$d/v$ver.tar.gz"; then
              echo "published $slug $ver → OCI"
            else
              echo "OCI publish failed for $slug (non-fatal)"
            fi
            echo "OK $slug v$ver"; echo "::endgroup::"
          done
      # Upload the dist tree for the central pages.yml aggregator to union into
      # the GitHub Pages mirror. Named `dist-*` so pages.yml discovers it.
      - uses: actions/upload-artifact@v4
        if: hashFiles('out/**') != ''
        with:
          name: dist-windows-rust-${{ matrix.chunk }}
          path: out
          if-no-files-found: ignore
